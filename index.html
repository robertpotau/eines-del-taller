.opt { display: flex; align-items: center; gap: .8rem; padding: .8rem 1.1rem; border-radius: 1.2rem; background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); border: .18rem solid var(--line); text-align: left; font-size: 1.5rem; font-weight: 800; transition: transform .12s, background .15s, border-color .15s; min-height: 4.4rem; }
.opt:hover:not(:disabled) { transform: translateY(-.15rem); border-color: #fff; }
.letter { flex: none; width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #1a1a3a; font-size: 1.1rem; }
.c0 .letter { background: var(--coral); } .c1 .letter { background: var(--sky); } .c2 .letter { background: var(--mint); } .c3 .letter { background: var(--gold); }
.opt.sel { border-color: var(--gold); background: rgba(255,210,63,.22); animation: throb .6s infinite alternate; }
.opt.right { border-color: var(--mint); background: rgba(61,220,151,.3); animation: glow .6s 3; }
.opt.wrong { border-color: var(--coral); background: rgba(255,107,107,.28); text-decoration: line-through; opacity: .85; }
.opt.gone { visibility: hidden; }
.opt:disabled:not(.right):not(.wrong):not(.sel) { opacity: .65; }
@keyframes glow { 50% { box-shadow: 0 0 2rem var(--mint); } }
.q-hint { margin-top: .9rem; min-height: 0; padding: 0; border-radius: .9rem; font-weight: 700; display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; align-items: center; }
.q-hint.on { padding: .55rem 1rem; background: rgba(255,255,255,.1); border: 1px solid var(--line); }
.q-hint.okx { background: rgba(61,220,151,.16); border-color: var(--mint); } .q-hint.kox { background: rgba(255,107,107,.16); border-color: var(--coral); }
.under-q { display: flex; gap: .8rem; justify-content: center; margin-top: .9rem; flex-wrap: wrap; }
.btn-hint { padding: .45rem 1rem; border-radius: 99rem; background: rgba(76,201,240,.18); border: 1px solid var(--sky); font-weight: 900; } .btn-hint small { font-weight: 700; }
.btn-hint:disabled { opacity: .4; }
.confirm-bar { max-width: 46rem; margin: .8rem auto 0; padding: .7rem 1rem; border-radius: 1rem; background: rgba(255,210,63,.16); border: 1px solid var(--gold); display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; justify-content: center; }
.shake { animation: shake .45s; } @keyframes shake { 20%,60% { transform: translateX(-.6rem); } 40%,80% { transform: translateX(.6rem); } }

/* ---------- golden ladder ---------- */
.ladder { display: grid; grid-template-columns: 1fr 16rem; gap: 1.2rem; align-items: start; }
.ladder-main .who-banner { max-width: none; }
.ladder-side { display: grid; gap: .9rem; }
.lifelines { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; }
.life { display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .45rem .15rem; border-radius: .9rem; background: linear-gradient(160deg, rgba(76,201,240,.28), rgba(167,139,250,.2)); border: .14rem solid var(--sky); font-weight: 800; }
.life .ico { width: 1.9rem; height: 1.9rem; } .life small { font-size: .55rem; line-height: 1.05; text-align: center; }
.life .fifty { font-weight: 900; font-size: .85rem; line-height: 1.9rem; }
.life:disabled { opacity: .3; filter: grayscale(1); position: relative; } .life:disabled::after { content: '\2715'; position: absolute; color: var(--coral); font-size: 2rem; top: .1rem; font-weight: 900; }
.prizes { list-style: none; display: grid; gap: .22rem; }
.prizes li { display: flex; align-items: center; gap: .5rem; padding: .22rem .7rem; border-radius: .6rem; background: rgba(255,255,255,.06); font-weight: 800; font-size: .88rem; }
.prizes li .n { width: 1.6rem; color: var(--text2); } .prizes li .v { flex: 1; text-align: right; color: var(--gold); }
.prizes li.safe { background: rgba(76,201,240,.18); } .prizes li.done { opacity: .5; }
.prizes li.now { background: linear-gradient(90deg, #ffd23f, #fb923c); color: #2b1a00; transform: scale(1.04); } .prizes li.now .n, .prizes li.now .v { color: #2b1a00; }
.q-sum { text-align: center; margin: .5rem 0; padding: .6rem; border-radius: 1rem; background: rgba(0,0,0,.25); }
.sum-opts { display: flex; flex-wrap: wrap; gap: .5rem 1.2rem; justify-content: center; margin-top: .4rem; font-weight: 800; font-size: 1.15rem; } .sum-o b { color: var(--gold); margin-right: .2rem; }
.vote-rows { display: grid; gap: .5rem; margin: .8rem 0; }
.vote-row { display: grid; grid-template-columns: 2.3rem 1fr 40% 4ch auto auto; align-items: center; gap: .5rem; font-weight: 800; }
.vote-row .vl { text-align: left; } .vbar { height: 1.2rem; border-radius: 99rem; background: rgba(255,255,255,.12); overflow: hidden; } .vbar i { display: block; height: 100%; width: 0; background: var(--sky); transition: width .4s; }
.vote-n { text-align: right; color: var(--gold); }
.friend-list { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: .6rem; } .friend { border: .15rem solid var(--pc, var(--line)); }
.team-prize { display: flex; align-items: center; justify-content: center; gap: .8rem; margin: 1rem auto; padding: .8rem 1.4rem; border-radius: 1.2rem; background: rgba(255,210,63,.14); border: 1px solid var(--gold); max-width: 32rem; } .team-prize .ico { width: 3rem; height: 3rem; } .team-prize small { display: block; color: var(--text2); }

/* ---------- memory ---------- */
/* the whole board must fit on the whiteboard: its width follows the available height */
.mgrid { --gap: .7rem; display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: var(--gap); margin: 0 auto; perspective: 1000px;
  width: min(100%, calc(var(--cols) * ((100vh - 15rem - (var(--rows) - 1) * var(--gap)) / var(--rows)) * 1.45 + (var(--cols) - 1) * var(--gap))); }
.mcard { position: relative; aspect-ratio: 1.45; transform-style: preserve-3d; transition: transform .45s; border-radius: 1rem; }
.mcard.up, .mcard.done { transform: rotateY(180deg); }
.mcard .face { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 1rem; backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: .3rem; }
.mcard .back { background: repeating-linear-gradient(45deg, #3b2a8f, #3b2a8f .6rem, #4b36b3 .6rem, #4b36b3 1.2rem); border: .18rem solid var(--violet); } .mcard .back .ico { width: 36%; height: 36%; opacity: .75; }
.mcard:hover:not(.up):not(.done) { filter: brightness(1.2); }
.mcard .front { transform: rotateY(180deg); background: linear-gradient(160deg, #fff, #dfe4ff); color: #1a1a4a; border: .2rem solid #fff; font-weight: 900; font-size: 1.7rem; text-align: center; line-height: 1.1; }
.mcard .front.pic .ico { width: 70%; height: 70%; }
.mcard.done .front { border-color: var(--pc); background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 35%, #fff), #fff); box-shadow: 0 0 1rem var(--pc); }
.mcard.done { cursor: default; }

/* ---------- match-up ---------- */
.mboard { display: grid; grid-template-columns: 1fr 3rem 1fr; gap: 0 .8rem; max-width: 60rem; margin: 0 auto; align-items: center; }
.mcol { display: grid; gap: .7rem; }
.mmid { text-align: center; font-size: 3rem; font-weight: 900; color: var(--gold); }
.mw { display: flex; align-items: center; gap: .6rem; padding: .8rem 1rem; border-radius: 1rem; background: var(--card); border: .18rem solid var(--line); font-size: 1.6rem; font-weight: 800; min-height: 4rem; transition: .15s; }
.mw.l { border-left-color: var(--sky); } .mw.r { border-right-color: var(--coral); }
.mw:hover:not(.done) { background: var(--card2); }
.mw.sel { border-color: var(--gold); background: rgba(255,210,63,.22); transform: scale(1.04); }
.mw.done { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 28%, transparent); cursor: default; }
.mw-n { width: 1.8rem; height: 1.8rem; border-radius: 50%; display: grid; place-items: center; font-size: .95rem; flex: none; } .mw.done .mw-n { background: var(--pc); color: #12123a; }
.mw:not(.done) .mw-n { display: none; }
.mw.bad { animation: shake .4s; border-color: var(--coral); background: rgba(255,107,107,.25); }

/* ---------- word bank ---------- */
.wordbank h2 { font-size: 2rem; margin-bottom: .6rem; }
.wb-tools { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-bottom: .4rem; }
.wb-tools input { font: inherit; padding: .5rem 1rem; border-radius: .8rem; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: #fff; min-width: 14rem; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .7rem; margin-top: .8rem; }
.wcard { display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .7rem .4rem; border-radius: 1rem; background: var(--card); border: 1px solid var(--line); transition: .15s; }
.wcard:hover { transform: translateY(-.2rem); background: var(--card2); border-color: var(--gold); }
.wcard .ico { width: 3rem; height: 3rem; } .wcard b { font-size: 1.1rem; } .wcard small { color: var(--text2); }
.wd-top { display: flex; align-items: center; gap: 1rem; margin-bottom: .6rem; } .wd-top h2 { font-size: 2.4rem; }
.wd-ca { color: var(--gold); font-weight: 900; font-size: 1.3rem; } .wd-def, .wd-ex { font-size: 1.1rem; margin: .5rem 0; } .wd-rel { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin: .5rem 0; }
.flash { display: flex; flex-direction: column; align-items: center; gap: .8rem; max-width: 46rem; margin: 0 auto; }
.fc-prog { width: 100%; height: .6rem; border-radius: 99rem; background: rgba(255,255,255,.14); overflow: hidden; } .fc-prog i { display: block; height: 100%; background: var(--mint); transition: width .3s; }
.fcard { position: relative; width: 100%; height: 24rem; perspective: 1200px; cursor: pointer; }
.fc-face { position: absolute; inset: 0; border-radius: 1.6rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; padding: 1.2rem; text-align: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .5s; background: linear-gradient(160deg, #fff, #dfe4ff); color: #1a1a4a; box-shadow: 0 1rem 2.5rem rgba(0,0,0,.4); }
.fc-face.back { transform: rotateY(180deg); background: linear-gradient(160deg, #fff6d9, #ffe49a); }
.fcard.flipped .front { transform: rotateY(-180deg); } .fcard.flipped .back { transform: rotateY(0); }
.fc-word { font-size: 3.6rem; font-weight: 900; } .fc-word.sm { font-size: 2.4rem; } .fc-face small { color: #5a5a8a; } .fc-face p { font-size: 1.2rem; font-weight: 700; } .fc-face .wd-ca { color: #b45309; }
.fc-actions { margin-top: .4rem; }

/* ---------- rounds, speed ---------- */
.rounds { max-width: 62rem; margin: 0 auto; }
.speed-stat { display: flex; justify-content: center; gap: 2rem; font-weight: 900; font-size: 1.1rem; margin-bottom: .6rem; color: var(--gold); }
.speed-area .opt { min-height: 3.6rem; font-size: 1.35rem; }

/* ---------- hot seat ---------- */
.hotseat { max-width: 56rem; margin: 0 auto; text-align: center; }
.hs-card { margin: .6rem auto; padding: 1.6rem 1rem; border-radius: 1.6rem; background: linear-gradient(160deg, #fff, #dfe4ff); color: #1a1a4a; box-shadow: 0 1rem 2.4rem rgba(0,0,0,.4); display: flex; flex-direction: column; align-items: center; gap: .5rem; }
.hs-card.flash { animation: flipin .45s; } @keyframes flipin { from { transform: rotateX(70deg); opacity: .2; } }
.hs-word { font-size: clamp(3rem, 9vw, 6rem); font-weight: 900; line-height: 1; } .hs-meta { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; } .hs-meta .chip { background: #e7e9ff; color: #3a3a7a; border-color: #c4c8f0; }
.hs-hint { margin: .5rem auto; padding: .6rem 1.2rem; border-radius: 1rem; background: rgba(255,255,255,.1); font-size: 1.3rem; font-weight: 700; max-width: 40rem; }
.seat { position: relative; display: inline-block; } .seat-ico { position: absolute; right: -2.6rem; bottom: -.4rem; width: 4rem; height: 4rem; }

/* ---------- balloon pop ---------- */
.hangman { max-width: 62rem; margin: 0 auto; }
.hm-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 1rem; align-items: center; }
.balloons svg { width: 100%; max-height: min(16rem, 30vh); } .bl { transition: .3s; transform-origin: center; } .bl.popped { opacity: 0; transform: translateY(-1rem) scale(1.4); }
.hm-side { text-align: center; } .hm-cat { display: flex; gap: .8rem; justify-content: center; align-items: center; margin-bottom: .6rem; flex-wrap: wrap; }
.hm-word { display: flex; flex-wrap: wrap; justify-content: center; gap: .35rem; margin: .5rem 0; }
.hl { width: 2.6rem; height: 3.4rem; display: grid; place-items: center; border-radius: .6rem; background: rgba(255,255,255,.1); border-bottom: .22rem solid var(--gold); font-size: 2rem; font-weight: 900; } .hl.on { background: rgba(61,220,151,.25); border-color: var(--mint); animation: pop .4s; } .hl.sep { background: none; border: 0; width: 1.4rem; }
.kb { margin: 1rem auto 0; display: grid; gap: .4rem; max-width: 52rem; } .kb-row { display: flex; gap: .35rem; justify-content: center; }
.key { width: min(2.9rem, 8.5vw); height: min(2.9rem, 8.5vw); border-radius: .6rem; background: var(--card2); border: 1px solid var(--line); font-weight: 900; font-size: 1.2rem; } .key:hover:not(:disabled) { background: rgba(255,255,255,.3); }
.key.ok { background: rgba(61,220,151,.4); border-color: var(--mint); } .key.bad { background: rgba(255,107,107,.35); border-color: var(--coral); opacity: .6; }

/* ---------- podium ---------- */
.podium-screen { text-align: center; max-width: 56rem; margin: 0 auto; }
.pod-title { font-size: 2.2rem; background: linear-gradient(90deg, var(--gold), var(--coral)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pod-sub { color: var(--text2); font-weight: 700; margin-bottom: .6rem; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: .8rem; margin: .5rem 0; min-height: 14rem; }
.podium .avatar.xl { width: 4.2rem; height: 4.2rem; }
.pstep { display: flex; flex-direction: column; align-items: center; gap: .25rem; width: 11rem; animation: rise .8s backwards; }
.pstep.r1 { order: 2; animation-delay: .5s; } .pstep.r2 { animation-delay: .25s; } .pstep.r3 { animation-delay: 0s; }
.p-medal .ico { width: 3rem; height: 3rem; } .p-name { font-weight: 900; font-size: 1.3rem; } .p-score { color: var(--gold); font-weight: 800; }
.p-block { width: 100%; border-radius: .9rem .9rem 0 0; background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 70%, #fff), color-mix(in srgb, var(--pc) 35%, #1b1a5c)); font-size: 2.6rem; font-weight: 900; color: #12123a; padding: .4rem 0; }
.pstep.r1 .p-block { height: 6rem; } .pstep.r2 .p-block { height: 4.2rem; } .pstep.r3 .p-block { height: 3rem; }
.p-block { font-size: 2rem; padding: .2rem 0; }
.pstep.win .avatar { box-shadow: 0 0 1.6rem var(--gold); animation: bob 2s infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(4rem); } }
.pod-rest { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }
.mvp { margin: .8rem 0; font-size: 1.15rem; }
.review { margin: 1rem 0; padding: 1rem; border-radius: 1.2rem; background: var(--card); border: 1px solid var(--line); } .review h3 { margin-bottom: .6rem; }

/* ---------- trophies ---------- */
.trophy-screen h2 { font-size: 2rem; margin-bottom: .4rem; } .trophy-screen h3 { margin: 1.2rem 0 .5rem; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .8rem; margin-top: .6rem; }
.tcell { display: flex; flex-direction: column; align-items: center; text-align: center; gap: .2rem; padding: .9rem; border-radius: 1.1rem; background: var(--card); border: 1px solid var(--line); }
.tcell .ico { width: 3rem; height: 3rem; } .tcell small { color: var(--text2); } .tw { display: flex; gap: .3rem; margin-top: .3rem; }
.tw-p { width: 1.7rem; height: 1.7rem; border-radius: 50%; border: .12rem solid var(--pc); display: grid; place-items: center; filter: grayscale(1); opacity: .3; } .tw-p .ico { width: 80%; height: 80%; } .tw-p.got { filter: none; opacity: 1; background: color-mix(in srgb, var(--pc) 35%, transparent); }
.tbl-wrap { overflow-x: auto; } table.stats { width: 100%; border-collapse: collapse; } .stats th, .stats td { padding: .5rem .8rem; text-align: left; border-bottom: 1px solid var(--line); } .stats th { color: var(--gold); }
.selftest pre { white-space: pre-wrap; font-size: .8rem; background: rgba(0,0,0,.35); padding: 1rem; border-radius: .8rem; max-height: 70vh; overflow: auto; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .mode-grid { grid-template-columns: 1fr 1fr; }
  .ladder { grid-template-columns: 1fr; } .ladder-side { order: -1; }
  .prizes { grid-template-columns: repeat(5, 1fr); display: none; }
  .hm-main { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .mode-grid { grid-template-columns: 1fr; } .q-opts { grid-template-columns: 1fr; } .mboard { grid-template-columns: 1fr; } .mmid { display: none; }
  .vote-row { grid-template-columns: 2.3rem 1fr 4ch auto auto; } .vbar { display: none; } .friend-list { grid-template-columns: 1fr; }
  #crumb { display: none; } .pmini { min-width: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* ---------- profiles & experience ---------- */
.profile-chip { display: flex; align-items: center; gap: .4rem; margin: 0 auto .6rem; padding: .35rem 1rem; border-radius: 99rem; background: var(--card); border: 1px solid var(--line); font-weight: 700; }
.profile-chip:hover { background: var(--card2); } .profile-chip small { color: var(--text2); }
.profiles-screen { text-align: center; } .profiles-screen h2 { font-size: 2.2rem; margin: .6rem 0; }
.prgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1rem; max-width: 70rem; margin: 1rem auto; }
.prcard { padding: 1rem; border-radius: 1.2rem; background: var(--card); border: .15rem solid var(--line); display: flex; flex-direction: column; align-items: center; gap: .5rem; }
.prcard.cur { border-color: var(--gold); box-shadow: 0 0 1.2rem rgba(255,210,63,.3); }
.prcard input { width: 100%; text-align: center; font: inherit; font-size: 1.3rem; font-weight: 800; color: #fff; background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: .7rem; padding: .4rem; }
.pr-who { display: flex; flex-wrap: wrap; gap: .35rem; justify-content: center; } .pr-p { display: inline-flex; align-items: center; gap: .2rem; padding: .15rem .6rem .15rem .3rem; border-radius: 99rem; border: 1px solid var(--pc); font-size: .85rem; font-weight: 700; } .pr-p .ico { width: 1.4rem; height: 1.4rem; }
.xp-panel { margin: 1rem 0; padding: .8rem 1rem; border-radius: 1.2rem; background: var(--card); border: 1px solid var(--line); text-align: left; }
.xp-panel h3 { margin-bottom: .5rem; text-align: center; }
.xp-row { display: grid; grid-template-columns: 2rem 8rem 5rem 11rem 1fr 11rem; align-items: center; gap: .6rem; padding: .25rem 0; border-top: 1px solid rgba(255,255,255,.08); }
.xp-gain { color: var(--mint); font-weight: 900; } .xp-rank { font-weight: 700; } .xp-row small { color: var(--text2); }
@media (max-width: 760px) { .xp-row { grid-template-columns: 2rem 1fr auto; } .xp-row .xpbar, .xp-row small, .xp-row .xp-rank { display: none; } }
::placeholder { color: rgba(255,255,255,.55); }
.imp-list { list-style: none; margin: .6rem 0; display: grid; gap: .3rem; font-size: .9rem; } .imp-list li { padding: .35rem .6rem; border-radius: .6rem; background: rgba(255,255,255,.07); }
.modal select { font: inherit; width: 100%; padding: .5rem; border-radius: .6rem; color: #fff; background: rgba(0,0,0,.35); border: 1px solid var(--line); margin-top: .3rem; }
.modal select option { color: #111; }
.muted.small { font-size: .85rem; text-align: center; }
.btn.small.on { border-color: var(--mint); background: rgba(61,220,151,.18); }
input[type=range] { width: 11rem; accent-color: var(--gold); }

/* Nunito (SIL OFL 1.1) — font local, sense connexions externes */
@font-face { font-family: 'Nunito'; font-style: normal; font-weight: 400 900; font-display: swap; src: url('fonts/nunito-400.woff2') format('woff2'); }
/* Eines del taller — estils propis (c) 2026 Robert Potau Nuñez. Tots els drets reservats. */
.fam-dot { display: inline-grid; place-items: center; width: 1.4em; height: 1.4em; border-radius: 50%; background: var(--fc, #888); vertical-align: -.3em; }
.fam-dot .ico { width: .95em; height: .95em; }
.fam-chip { display: inline-flex; align-items: center; gap: .3rem; padding: .25rem .8rem; border-radius: 99rem; font-weight: 800; background: color-mix(in srgb, var(--fc) 35%, #12123a); border: .13rem solid var(--fc); }
.choice.sm[style*="--fc"].on { border-color: var(--fc); background: color-mix(in srgb, var(--fc) 30%, transparent); box-shadow: 0 0 .9rem color-mix(in srgb, var(--fc) 40%, transparent); }
.catalog h2, .tool-sheet h2 { font-size: 2rem; margin-bottom: .6rem; }
.fam-banner { display: none; align-items: center; gap: .8rem; padding: .7rem 1rem; border-radius: 1rem; margin: .4rem 0; background: color-mix(in srgb, var(--fc, #888) 20%, transparent); border: 1px solid var(--fc, var(--line)); }
.fam-banner.on { display: flex; flex-wrap: wrap; } .fam-banner p { flex: 1; min-width: 14rem; }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .8rem; margin: .8rem 0 1.2rem; }
.tcard { display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: .6rem; border-radius: 1.1rem; text-align: center; background: var(--card); border: .15rem solid color-mix(in srgb, var(--fc) 60%, transparent); transition: .15s; }
.tcard:hover { transform: translateY(-.25rem); background: var(--card2); border-color: var(--fc); }
.tc-img { width: 100%; height: 8rem; object-fit: contain; border-radius: .7rem; background: #fff; }
.tcard small { color: var(--text2); font-weight: 700; }
img.missing { visibility: hidden; }
.tool-sheet .gal { display: flex; flex-direction: column; align-items: center; gap: .4rem; }
.gal-main { width: 100%; height: 18rem; border-radius: 1rem; background: #fff; display: grid; place-items: center; overflow: hidden; }
.gal-main img { max-width: 100%; max-height: 100%; object-fit: contain; }
.gal-label { color: var(--text2); font-weight: 700; }
.gal-ths { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
.gal-th { width: 4.2rem; height: 4.2rem; border-radius: .6rem; overflow: hidden; background: #fff; border: .15rem solid transparent; }
.gal-th.on { border-color: var(--fc); box-shadow: 0 0 .7rem var(--fc); } .gal-th img { width: 100%; height: 100%; object-fit: contain; }
.tool-fam { display: flex; flex-direction: column; gap: .3rem; align-items: flex-start; margin: .6rem 0; }
.fcard.tall { height: 30rem; }
.fcard.tall .fc-face { border: .3rem solid var(--fc); overflow: hidden; }
.fc-big { max-width: 100%; max-height: 20rem; min-height: 0; object-fit: contain; flex: 1 1 auto; }
.fc-fam { display: flex; flex-direction: column; align-items: center; gap: .3rem; } .fc-fam small { font-size: .85rem; max-width: 34rem; }
.fc-mini { display: flex; gap: .6rem; height: 8rem; } .fc-mini img { height: 100%; width: auto; max-width: 14rem; object-fit: contain; border-radius: .5rem; background: #fff; border: 1px solid #ccd; }
.fc-face .fam-chip { color: #fff; } .fc-face .wd-ca { color: #b45309; }
.actions.left { justify-content: flex-start; align-items: center; margin: .4rem 0 0; }
.fc-count { margin-left: auto; color: var(--gold); }
.hub-title.grp { color: var(--mc); display: flex; align-items: center; justify-content: center; gap: .5rem; margin-top: 1.4rem; }
.mode-card.soon { opacity: .45; filter: grayscale(.6); cursor: not-allowed; } .mode-card.soon:hover { transform: none; box-shadow: none; }
.mode-card.hot::after { content: none; }
@media (max-width: 40rem) { .fcard.tall { height: 34rem; } .gal-main { height: 13rem; } }

/* Classifica */
.classify { max-width: 62rem; margin: 0 auto; display: flex; flex-direction: column; gap: .7rem; align-items: center; }
.cls-count { text-align: center; } .cls-turn { display: flex; align-items: center; gap: .4rem; padding: .2rem .9rem; border-radius: 99rem; border: .13rem solid var(--pc); background: color-mix(in srgb, var(--pc) 20%, transparent); }
.classify .fc-prog { width: 100%; }
.cls-card { display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: .8rem 1.2rem; border-radius: 1.4rem; background: linear-gradient(160deg, #fff, #dfe4ff); color: #1a1a4a; box-shadow: 0 .8rem 2rem rgba(0,0,0,.4); width: min(30rem, 100%); }
.cls-img { width: 100%; height: 13rem; object-fit: contain; } .cls-card h2 { font-size: 2rem; text-align: center; }
.cls-buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .6rem; width: 100%; }
.bucket { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25rem; padding: .7rem .5rem; min-height: 5rem; text-align: center; border-radius: 1rem; border: .17rem solid var(--fc); background: color-mix(in srgb, var(--fc) 22%, #15153f); transition: .15s; }
.bucket:hover:not(:disabled) { transform: translateY(-.2rem); background: color-mix(in srgb, var(--fc) 38%, #15153f); }
.bucket small { color: var(--text2); font-size: .72rem; line-height: 1.2; }
.bucket .bk-key { position: absolute; top: .25rem; left: .45rem; font-size: .7rem; opacity: .55; font-weight: 800; }
.bucket.right { background: rgba(61,220,151,.45); border-color: var(--good); box-shadow: 0 0 1.2rem rgba(61,220,151,.6); }
.bucket.wrong { background: rgba(255,107,107,.45); border-color: var(--bad); animation: shake .35s; }
.bucket:disabled:not(.right):not(.wrong) { opacity: .45; }
.cls-fb { display: none; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap; padding: .8rem 1.2rem; border-radius: 1rem; width: 100%; text-align: center; }
.cls-fb.on { display: flex; } .cls-fb.good { background: rgba(61,220,151,.2); border: 1px solid var(--good); } .cls-fb.bad { background: rgba(255,107,107,.18); border: 1px solid var(--bad); }
.cls-xp { font-weight: 900; color: var(--gold); }

/* Memory */
.mcard .front.word { font-size: 1.15rem; } .mcard .front.pic { padding: .2rem; } .mcard .front.pic img { max-width: 100%; max-height: 100%; object-fit: contain; }
.mcard .front.fam { display: flex; flex-direction: column; gap: .3rem; font-size: 1rem; background: linear-gradient(160deg, color-mix(in srgb, var(--fc) 30%, #fff), #fff); border-color: var(--fc); }
.mem-last { color: var(--gold); display: block; }
.mcard .face { overflow: hidden; }
.mcard .front.pic img { position: absolute; inset: .25rem; width: calc(100% - .5rem); height: calc(100% - .5rem); max-width: none; max-height: none; object-fit: contain; }

/* Preguntes (Escala i altres modes de 4 opcions) */
.q-imgbox { width: min(24rem, 90%); height: 14rem; background: #fff; border-radius: 1.2rem; display: grid; place-items: center; overflow: hidden; box-shadow: 0 .6rem 1.6rem rgba(0,0,0,.4); }
.q-imgbox img { width: 100%; height: 100%; object-fit: contain; } .q-imgbox.draw img { padding: .4rem; }
.q-text { font-size: clamp(1.8rem, 4.5vw, 3rem); } .q-text.def { font-size: clamp(1.2rem, 3vw, 1.9rem); color: var(--text); font-weight: 800; max-width: 40rem; }
.opt .olabel { font-size: 1.25rem; }
.q-opts.imgs .opt { justify-content: center; padding: .5rem; } .opt-img { width: 100%; height: 7.5rem; object-fit: contain; background: #fff; border-radius: .8rem; }
.sum-img { height: 3.2rem; width: auto; vertical-align: middle; background: #fff; border-radius: .4rem; }
@media (max-width: 40rem) { .q-imgbox { height: 10rem; } .opt-img { height: 5rem; } .opt .olabel { font-size: 1.05rem; } }

/* Uneix */
.matchgame { max-width: 56rem; margin: 0 auto; display: flex; flex-direction: column; gap: .7rem; }
.mt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; } .mt-col { display: flex; flex-direction: column; gap: .6rem; }
.mt { display: flex; align-items: center; justify-content: center; gap: .4rem; min-height: 5.2rem; padding: .4rem .6rem; border-radius: 1rem; background: var(--card2); border: .17rem solid var(--line); font-weight: 800; font-size: 1.2rem; text-align: center; transition: .15s; }
.mt:hover:not(.done) { border-color: #fff; transform: translateY(-.1rem); }
.mt.sel { border-color: var(--gold); background: rgba(255,210,63,.22); box-shadow: 0 0 1rem rgba(255,210,63,.4); }
.mt.done { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 30%, #15153f); opacity: .75; cursor: default; }
.mt.wrong { border-color: var(--bad); background: rgba(255,107,107,.3); animation: shake .35s; }
.mt-img { height: 4.6rem; max-width: 100%; object-fit: contain; background: #fff; border-radius: .6rem; }
/* Quina eina és? */
.hotseat { max-width: 44rem; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: .7rem; text-align: center; }
.hs-stage { width: min(26rem, 100%); height: 17rem; border-radius: 1.2rem; background: #fff; overflow: hidden; display: grid; place-items: center; box-shadow: 0 .8rem 2rem rgba(0,0,0,.45); }
.hs-img { width: 100%; height: 100%; object-fit: contain; transition: filter .6s; }
.hs-dots { display: flex; gap: .5rem; } .hs-dot { padding: .2rem .7rem; border-radius: 99rem; border: .12rem solid var(--line); font-weight: 800; font-size: .9rem; color: var(--text2); }
.hs-dot.on { border-color: var(--gold); color: #2b1a00; background: var(--gold); } .hs-dot.past { opacity: .35; text-decoration: line-through; }
.hs-info { min-height: 2.2rem; } .hs-answer { font-size: 1.5rem; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; justify-content: center; }
@media (max-width: 40rem) { .mt-grid { gap: .5rem; } .mt { font-size: 1rem; min-height: 4.4rem; } .hs-stage { height: 13rem; } }

.credits { margin-top: .8rem; padding-top: .6rem; border-top: 1px solid var(--line); font-size: .85rem; } .credits p { margin: .25rem 0; } .credits a { color: var(--sky); }

  const cols = ['#ffd23f', '#ff6b6b', '#4cc9f0', '#3ddc97', '#a78bfa', '#fb923c', '#f472b6'];
  x = x == null ? innerWidth / 2 : x; y = y == null ? innerHeight * 0.4 : y;
  const spread = (opts && opts.spread) || 1;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (3 + Math.random() * 9) * spread;
    FX.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, g: 0.25 + Math.random() * 0.15, w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pick(cols), life: 90 + rnd(70) });

  const { ctx, cv, parts } = FX;

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life--;
    if (p.life <= 0 || p.y > cv.height + 30) { parts.splice(i, 1); continue; }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life / 30);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  FX.raf = parts.length ? requestAnimationFrame(fxStep) : 0;

}

function distractorTools(t, n, close) {
  const same = shuffle(toolsOf(t.familia).filter(x => x.id !== t.id));
  const diff = shuffle(TOOLS.filter(x => x.familia !== t.familia));
  const out = same.slice(0, Math.min(close, same.length, n));
  for (const x of diff) { if (out.length >= n) break; out.push(x); }
  for (const x of same) { if (out.length >= n) break; if (!out.includes(x)) out.push(x); }

}

 * Retorna { type, tool, lead, big:Node, options:[{label}|{img,alt}], answer, explain, speakText, hint } o null

function makeQuestion(ctx) {

    'foto-nom': () => [{ lead: 'Quina eina és aquesta?', big: imgBox(photoOf(t, true), 'Eina'), hint: ofFam }, toolNames()],
    'esq-nom': () => [{ lead: 'Quina eina representa aquest esquema?', big: imgBox(t.esquema, 'Esquema', 'draw'), hint: ofFam }, toolNames()],
    'nom-foto': () => [{ lead: 'Quina foto és: ' + t.nom + '?', big: h('div', { class: 'q-text' }, t.nom), hint: ofFam }, toolPhotos()],
    'esq-foto': () => [{ lead: 'Quina foto correspon a aquest esquema?', big: imgBox(t.esquema, 'Esquema', 'draw'), hint: ofFam }, toolPhotos()],
    'nom-fam': () => [{ lead: 'De quina família és aquesta eina?', big: h('div', { class: 'q-text' }, t.nom), hint: t.fam.def }, families()],
    'foto-fam': () => [{ lead: 'De quina família és aquesta eina?', big: imgBox(photoOf(t, true), 'Eina'), hint: t.fam.def }, families()],
    'def-fam': () => [{ lead: 'Quina família serveix per a això?', big: h('div', { class: 'q-text def' }, '«' + t.fam.def + '»'), hint: 'Per exemple: ' + t.nom + '.' }, families()]

}

function award(pid, id) {

  if (!TROPHY[id] || p.trophies.includes(id)) return false;

/* ---------- partida ---------- */
let G = null;
const PLAY_MODES = ['classifica', 'memory', 'match', 'esquema', 'ladder', 'speed', 'hotseat', 'defs'];            // ids dels modes de joc competitius (es van afegint)
function newGame(mode, pids) {
  G = { mode, pids: pids.slice(), scores: {}, correct: {}, wrong: {}, streak: {}, best: {}, missed: new Set(), extra: {}, xpGain: {}, live: true };
  pids.forEach(id => { G.scores[id] = 0; G.correct[id] = 0; G.wrong[id] = 0; G.streak[id] = 0; G.best[id] = 0; });
  return G;
}
/** registra una resposta (toolId pot ser null). Retorna l'XP donat. `hint` divideix la recompensa per dos. */
function recordAnswer(pid, toolId, ok, hint) {
  if (toolId) noteResult(toolId, ok);
  const p = ST.players[pid];
  if (ok) {
    G.correct[pid]++; G.streak[pid]++; p.correct++;
    if (G.streak[pid] > G.best[pid]) G.best[pid] = G.streak[pid];
    if (G.streak[pid] > p.bestStreak) p.bestStreak = G.streak[pid];
    if (G.streak[pid] >= 5) award(pid, 'streak5');
    if (G.streak[pid] >= 10) award(pid, 'streak10');
    const xp = (hint ? 4 : 8) + Math.min(G.streak[pid], 5);
    giveXP(pid, xp); return xp;
  }
  G.wrong[pid]++; G.streak[pid] = 0; p.wrong++;
  if (toolId) G.missed.add(toolId);
  save(); return 0;
}
function addScore(pid, n) { G.scores[pid] = Math.max(0, (G.scores[pid] || 0) + n); if (G.bar) G.bar.update(G.scores, G.cur); }

/* ---------- avatars i marcador ---------- */
function avatar(pid, size) {
  return h('span', { class: 'avatar ' + (size || ''), style: '--pc:' + PCOLORS[pid] }, ico(ST.players[pid].avatar));
}
function scoreBar(pids, scores, fmt) {
  const bar = h('div', { class: 'scorebar' });
  const els = {}, last = {};
  pids.forEach(id => {
    const v = h('b', { class: 'sc-v' }, fmt ? fmt(scores[id] || 0) : (scores[id] || 0));
    els[id] = h('div', { class: 'sc', style: '--pc:' + PCOLORS[id] }, avatar(id, 'sm'), h('span', { class: 'sc-n' }, pname(id)), v);
    els[id].v = v; last[id] = scores[id] || 0;
    bar.append(els[id]);
  });
  bar.update = (sc, cur) => {
    pids.forEach(id => {
      const nv = sc[id] || 0;
      els[id].v.textContent = fmt ? fmt(nv) : nv;
      if (nv > last[id]) { els[id].classList.remove('pop'); void els[id].offsetWidth; els[id].classList.add('pop'); }
      last[id] = nv;
      els[id].classList.toggle('cur', id === cur);
    });
  };
  bar.update(scores, null);
  return bar;
}

/* ---------- compte enrere ---------- */
function countdown(secs, onEnd, opts) {
  opts = opts || {};
  let left = secs, total = secs, stopped = false, paused = false;
  const fill = h('i'), num = h('b', null, Math.ceil(left));
  const el = h('div', { class: 'cd' + (opts.big ? ' big' : '') }, h('div', { class: 'cd-bar' }, fill), num);
  const paint = () => {
    num.textContent = Math.max(0, Math.ceil(left));
    fill.style.width = clamp(100 * left / total, 0, 100) + '%';
    el.classList.toggle('low', left <= 5);
  };
  paint();
  const id = Timers.every(() => {
    if (stopped || paused) return;
    left -= 0.1; paint();
    if (opts.tick && left <= 5 && Math.abs(left - Math.round(left)) < 0.05) sfx('tick');
    if (left <= 0) { stopped = true; Timers.stop(id); onEnd && onEnd(); }
  }, 100);
  return { el, stop() { stopped = true; Timers.stop(id); }, pause() { paused = true; }, resume() { paused = false; }, add(n) { left += n; total = Math.max(total, left); paint(); }, left: () => left };
}

/* ---------- final de partida: XP, trofeus, podi ---------- */
function finishGame(opts) {
  // opts: { title, subtitle, order:[pid millor primer], scoreText:(pid)=>string, scoreOf, again:fn, note:Node }
  const pids = G.pids, multi = pids.length > 1;
  const order = opts.order || pids.slice().sort((a, b) => G.scores[b] - G.scores[a]);
  pids.forEach(id => {
    const p = ST.players[id];
    p.games++; p.modes[G.mode] = (p.modes[G.mode] || 0) + 1;
    award(id, 'first');
    giveXP(id, 20);
    if (PLAY_MODES.every(m => p.modes[m])) award(id, 'allModes');
  });
  let winners = [];
  if (multi) {
    const top = opts.scoreOf ? opts.scoreOf(order[0]) : G.scores[order[0]];
    winners = order.filter(id => (opts.scoreOf ? opts.scoreOf(id) : G.scores[id]) === top);
    if (top > 0 && winners.length < pids.length) winners.forEach(id => { award(id, 'winner'); giveXP(id, 30); });
  }
  save();
  showPodium(Object.assign({}, opts, { order, winners }));
}
function showPodium(o) {

  }
  if (G.pids.length > 1) {
    const best = G.pids.slice().sort((a, b) => G.correct[b] - G.correct[a])[0];
    if (G.correct[best] > 0) wrap.append(h('p', { class: 'mvp' }, ico('2B50'), ' Més encerts: ', h('b', null, pname(best)), ' (' + G.correct[best] + ')'));
  }
  if (o.note) wrap.append(o.note);
  if (G.xpGain && G.pids.some(id => G.xpGain[id])) {
    wrap.append(h('div', { class: 'xp-panel' }, h('h3', null, ico('2B50'), ' Experiència guanyada'), G.pids.map(id => {
      const ri = rankInfo(id), p = ST.players[id];
      return h('div', { class: 'xp-row', style: '--pc:' + PCOLORS[id] }, avatar(id, 'sm'), h('b', null, pname(id)),
        h('span', { class: 'xp-gain' }, '+' + Math.round(G.xpGain[id] || 0) + ' XP'),
        h('span', { class: 'xp-rank' }, ico(ri.rank.ic, 'tiny'), ' ' + ri.rank.name),
        h('div', { class: 'xpbar' }, h('i', { style: 'width:' + ri.pct + '%' })),
        h('small', null, p.xp + ' XP' + (ri.next ? ' · proper rang als ' + ri.next.xp : ' · rang màxim!')));
    })));
  }
  const missed = Array.from(G.missed).map(toolById).filter(Boolean);

      h('div', { class: 'chips' }, missed.slice(0, 14).map(t => h('button', { class: 'chip big', onclick: () => showTool(t, missed), title: 'Obre la fitxa' }, t.nom, h('small', null, ' · ' + t.fam.curt))))));
  }
  const acts = h('div', { class: 'actions' });
  if (o.again) acts.append(h('button', { class: 'btn primary', onclick: o.again }, ico('1F501'), ' Torna-hi'));
  acts.append(h('button', { class: 'btn', onclick: () => showHub() }, ico('1F3E0'), ' Inici'));
  wrap.append(acts);
  render(wrap, o.title || 'Resultats');
  sfx('win'); confetti(110, innerWidth / 2, innerHeight * 0.3);
  Timers.set(() => confetti(50, innerWidth * 0.2, innerHeight * 0.35), 500);

}

/** def: { id, name, ic, desc, rules:[], options:[{key,label,choices:[{v,label,desc}], def}], minPlayers, noOrder, onStart(cfg, pids) } */

    h('button', { class: 'btn', onclick: () => showHub() }, '← Enrere'),
    h('button', { class: 'btn primary big', id: 'btn-go', disabled: pids.length < need, onclick: () => {
      ST.prefs[def.id] = Object.assign({}, cfg); save(); sfx('start');

  if (pids.length < need) wrap.append(h('p', { class: 'warn' }, 'Aquest mode necessita almenys ' + need + ' jugadors.'));
  wrap.append(acts);
  render(wrap, def.name);

/* ---------- exportar / importar perfils (un .json) ---------- */
function exportPayload(indices) {
  return { app: 'eines-del-taller', format: 1, version: VERSION, exported: new Date().toISOString(),
    profiles: indices.map(i => JSON.parse(JSON.stringify(ST.profiles[i]))) };
}
function parseProfilesFile(text) {
  let o; try { o = JSON.parse(text); } catch (e) { throw new Error('Aquest fitxer no és un fitxer de perfils vàlid.'); }
  if (!o || o.app !== 'eines-del-taller' || !Array.isArray(o.profiles) || !o.profiles.length) throw new Error('Aquest fitxer no conté perfils d’Eines del taller.');
  if (o.profiles.length > MAX_PROFILES) throw new Error('El fitxer té massa perfils.');
  return { exported: o.exported || '', profiles: o.profiles.map((p, i) => normaliseProfile(p, i)) };
}
function exportProfiles(indices) {
  const data = exportPayload(indices);
  const day = new Date().toISOString().slice(0, 10);
  const one = indices.length === 1 ? profileLabel(ST.profiles[indices[0]], indices[0]).replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '') : 'tots-els-perfils';
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: 'eines-' + (one || 'perfil') + '-' + day + '.json' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast(indices.length + (indices.length === 1 ? ' perfil desat' : ' perfils desats') + ' en un fitxer', 'good');
}
function readImportFile(file) {
  if (file.size > 5e6) return toast('Aquest fitxer és massa gran', 'bad');
  const rd = new FileReader();
  rd.onload = () => {
    let res; try { res = parseProfilesFile(String(rd.result)); } catch (e) { return toast(e.message, 'bad'); }
    confirmImport(res.profiles);
  };
  rd.onerror = () => toast('No s’ha pogut llegir el fitxer', 'bad');
  rd.readAsText(file);
}
function confirmImport(profiles) {
  const summary = list => h('ul', { class: 'imp-list' }, list.map((pr, i) => h('li', null, h('b', null, profileLabel(pr, i)), ' — ',
    pr.players.slice(0, pr.active).map(p => (p.name || 'Jugador') + ' (' + p.xp + ' XP)').join(', '))));
  const done = () => { closeModal(); saveAll(); toast('Perfils importats', 'good'); showProfiles(); };
  if (profiles.length === 1) {
    const sel = h('select', { 'aria-label': 'On posar el perfil' }, ST.profiles.map((pr, i) => h('option', { value: i, selected: i === ST.cur }, (i + 1) + '. ' + profileLabel(pr, i) + (i === ST.cur ? ' (actual)' : ''))));
    openModal(h('div', null, h('h3', null, ico('1F4C2'), ' Importa un perfil'), summary(profiles),
      h('p', null, 'Posa’l en aquest lloc (el que hi ha ara se substituirà):'), sel,
      h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: closeModal }, 'Cancel·la'),
        h('button', { class: 'btn primary', onclick: () => { ST.profiles[parseInt(sel.value, 10)] = profiles[0]; done(); } }, 'Importa'))));

  let deck = deck0.slice(), total = deck.length, known = 0, again = [];

    if (!deck.length) {
      if (again.length) {
        const w = h('div', { class: 'intro' }, h('h2', null, 'Ronda acabada'), h('p', null, 'Has marcat ' + again.length + (again.length === 1 ? ' targeta' : ' targetes') + ' per repassar.'),

          h('div', { class: 'actions' }, h('button', { class: 'btn primary big', onclick: () => { deck = shuffle(again); again = []; next(); } }, 'Repassa-les'),
            h('button', { class: 'btn', onclick: () => showCatalog() }, 'Catàleg')));
        render(w, 'Flashcards'); return;
      }
      sfx('win'); confetti(120);
      render(h('div', { class: 'intro' }, h('h2', null, ico('1F389'), ' Totes les targetes fetes!'), h('p', null, total + (total === 1 ? ' eina repassada.' : ' eines repassades.')),
        h('div', { class: 'actions' }, h('button', { class: 'btn primary big', onclick: () => setupFlash() }, 'Una altra ronda'), h('button', { class: 'btn', onclick: () => showCatalog() }, 'Catàleg'))), 'Flashcards');
      return;
    }
    const t = deck[0]; let flipped = false;
    noteViewed(t.id);
    const face = cfg && cfg.face === 'name' ? 'name' : cfg && cfg.face === 'mixed' ? (Math.random() < .5 ? 'name' : 'photo') : 'photo';
    const photo = photoOf(t, false);
    const alt = t.fotos.map(f => f.f).filter(p => p !== photo);
    const fam = h('div', { class: 'fc-fam' }, famChip(t.fam), h('small', null, t.fam.def));
    const mini = h('div', { class: 'fc-mini' }, pic(t.esquema, 'Esquema'), alt.length ? pic(pick(alt), '') : null);
    const nameBlock = [h('div', { class: 'fc-word sm' }, t.nom), t.alies.length ? h('div', { class: 'wd-ca' }, 'També: ' + t.alies.join(', ')) : null];
    const front = face === 'photo' ? h('div', { class: 'fc-face front' }, pic(photo, '', 'fc-big'), h('small', null, 'Toca per veure el nom i la família'))
      : h('div', { class: 'fc-face front' }, h('div', { class: 'fc-word' }, t.nom), h('small', null, 'Toca per veure l’eina'));
    const back = face === 'photo' ? h('div', { class: 'fc-face back' }, nameBlock, fam, mini)
      : h('div', { class: 'fc-face back' }, pic(photo, t.nom, 'fc-big'), h('div', { class: 'fc-word sm' }, t.nom), fam);
    const card = h('div', { class: 'fcard tall', role: 'button', tabindex: 0, 'aria-label': 'Gira la targeta', style: '--fc:' + t.fam.color, onclick: flip }, front, back);
    const prog = h('div', { class: 'fc-prog' }, h('i', { style: 'width:' + (100 * known / total) + '%' }));
    const mark = ok => { noteResult(t.id, ok); deck.shift(); if (ok) known++; else again.push(t); sfx(ok ? 'ok' : 'ko'); next(); };
    const btns = h('div', { class: 'actions fc-actions' },
      h('button', { class: 'btn danger', onclick: () => mark(false) }, '✗ Un altre cop'),
      ttsReady() ? h('button', { class: 'btn', onclick: () => speak(t.nom) }, ico('1F50A'), ' Escolta') : null,
      h('button', { class: 'btn primary', onclick: () => mark(true) }, '✓ Ja la sé'));
    function flip() { flipped = !flipped; card.classList.toggle('flipped', flipped); sfx('flip'); if (flipped) speak(t.nom); }
    render(h('div', { class: 'flash' }, h('div', { class: 'muted' }, 'Targeta ' + (known + again.length + 1) + ' de ' + total + ' · caixa ' + boxOf(t.id) + '/5'), prog, card, btns,
      h('div', { class: 'actions' }, h('button', { class: 'btn small', onclick: () => showCatalog() }, '← Catàleg'))), 'Flashcards');

      if (e.key === ' ' || e.key === 'Enter') { flip(); return true; }
      if (e.key === 'ArrowRight') { mark(true); return true; }
      if (e.key === 'ArrowLeft') { mark(false); return true; }
      return false;
    });
  }
  next();

      { key: 'help', label: 'Ajuda', def: 'def', choices: [{ v: 'def', label: 'Amb definicions', desc: 'Cada caixa explica què fa la família (menys XP)' }, { v: 'no', label: 'Sense ajuda', desc: 'Només el nom de la família' }] },

    onStart: startClassifica

function startClassifica(cfg, pids) {
  newGame('classifica', pids);
  const chosen = shuffle(FAMS).slice(0, cfg.fams);
  const fams = FAMS.filter(f => chosen.includes(f));
  const deck = shuffle(TOOLS.filter(t => fams.some(f => f.id === t.familia)));
  if (cfg.count) deck.length = Math.min(cfg.count, deck.length);
  let total = deck.length, done = 0, turn = 0, answered = 0, right = 0;
  const retried = new Set(), hint = cfg.help === 'def';
  G.bar = pids.length > 1 ? scoreBar(pids, G.scores) : null;

  function next() {
    if (!deck.length) return end();
    const t = deck.shift(), pid = pids[turn++ % pids.length];
    G.cur = pid;
    let locked = false, cd = null;
    const bucketEls = {};
    const fb = h('div', { class: 'cls-fb' });
    function answer(fid) {
      if (locked) return; locked = true; if (cd) cd.stop();
      const ok = fid === t.familia;
      answered++;
      const xp = recordAnswer(pid, t.id, ok, hint);
      Object.values(bucketEls).forEach(b => { b.disabled = true; });
      bucketEls[t.familia].classList.add('right');
      if (ok) {
        right++; done++;
        addScore(pid, 10 + Math.min(G.streak[pid], 5));
        sfx('ok'); if (xp) fb.append(h('span', { class: 'cls-xp' }, '+' + xp + ' XP'));
        fb.classList.add('on', 'good'); fb.prepend(h('b', null, 'Correcte!'));
        Timers.set(next, 900);
      } else {
        if (fid) bucketEls[fid].classList.add('wrong');
        sfx('ko');
        if (!retried.has(t.id)) { retried.add(t.id); deck.push(t); total++; } else done++;
        fb.classList.add('on', 'bad');
        fb.replaceChildren(h('div', null, h('b', null, fid ? 'Quasi! ' : 'S’ha acabat el temps. '), t.nom + ' és una eina de ', famChip(t.fam), h('p', null, t.fam.def)),
          h('button', { class: 'btn primary', id: 'cls-next', onclick: next }, 'Continua ', ico('25B6')));
        const nb = $('#cls-next'); if (nb) nb.focus({ preventScroll: true });
      }
    }
    render(() => {
      const wrap = h('div', { class: 'classify' });
      if (G.bar) { G.bar.update(G.scores, pid); wrap.append(G.bar); }
      if (pids.length > 1) wrap.append(h('div', { class: 'cls-turn', style: '--pc:' + PCOLORS[pid] }, avatar(pid, 'sm'), h('b', null, ' Torn de ' + pname(pid))));
      wrap.append(h('div', { class: 'muted cls-count' }, 'Eina ' + Math.min(done + 1, total) + ' de ' + total));
      wrap.append(h('div', { class: 'fc-prog' }, h('i', { style: 'width:' + (100 * done / total) + '%' })));
      wrap.append(h('div', { class: 'cls-card' }, pic(photoOf(t, true), t.nom, 'cls-img'), h('h2', null, t.nom)));
      if (cfg.timer) { cd = countdown(cfg.timer, () => answer(null), { tick: true }); wrap.append(cd.el); }
      const grid = h('div', { class: 'cls-buckets' });
      fams.forEach((f, i) => {
        const b = h('button', { class: 'bucket', style: '--fc:' + f.color, onclick: () => answer(f.id) },
          h('span', { class: 'bk-key' }, i === 9 ? '0' : String(i + 1)), famDot(f), h('b', null, f.nom), hint ? h('small', null, f.def) : null);
        bucketEls[f.id] = b; grid.append(b);
      });
      wrap.append(grid, fb);
      wrap.append(h('div', { class: 'actions' }, h('button', { class: 'btn small', onclick: () => showHub() }, '← Surt')));
      Keys.on(e => {
        if (e.key === 'Enter' || e.key === ' ') { const nb = $('#cls-next'); if (nb) { nb.click(); return true; } return false; }
        const i = e.key === '0' ? 9 : parseInt(e.key, 10) - 1;
        if (i >= 0 && fams[i]) { answer(fams[i].id); return true; }
        return false;
      });
      return wrap;
    }, 'Classifica');
  }

  function end() {
    const wrong = pids.reduce((a, id) => a + G.wrong[id], 0);
    if (!wrong && answered >= 10) pids.forEach(id => award(id, 'classifica'));
    const pct = answered ? Math.round(100 * right / answered) : 0;
    finishGame({ title: 'Classifica', subtitle: right + ' encerts de ' + answered + ' respostes (' + pct + '%)',
      scoreText: id => G.scores[id] + ' punts', again: () => startClassifica(cfg, pids) });
  }
  next();
}

/* ============================================================
   Eines del taller — mode MEMORY: parelles de foto i nom, nom i família, esquema i foto (1-6 jugadors per torns)
   (c) 2026 Robert Potau Nuñez. Tots els drets reservats.
   ============================================================ */
function setupMemory() {
  setupScreen({
    id: 'memory', name: 'Memory', ic: '1F9E0',
    desc: 'Gira dues targetes i troba parelles. Si n’encertes una, tornes a jugar!',
    options: [
      { key: 'kind', label: 'Quines parelles?', def: 'mixed', choices: [
        { v: 'nom', label: 'Foto + nom', desc: 'L’eina i com es diu' }, { v: 'fam', label: 'Nom + família', desc: 'Clau fixa – Eines de cargolar' },
        { v: 'esq', label: 'Esquema + foto', desc: 'El dibuix i l’eina real' }, { v: 'mixed', label: 'Barrejat', desc: 'De tot una mica' }] },
      { key: 'size', label: 'Quantes targetes?', def: 16, choices: [{ v: 12, label: '12 targetes' }, { v: 16, label: '16 targetes' }, { v: 20, label: '20 targetes' }] }
    ],
    rules: ['Parella trobada → +10 punts i tornes a jugar. Cada parella seguida dona +2 més.', 'Si falles, passa el torn al següent jugador.',
      'Cada parella és d’una família diferent, així no hi ha confusions.'],
    onStart: startMemory
  });
}

/** n parelles; cada una d'una família diferent (així mai no hi ha dues respostes possibles) */
function buildMemoryPairs(kind, n) {
  const fams = shuffle(FAMS).slice(0, n);
  return fams.map(f => {
    const t = pick(toolsOf(f.id));
    const k = kind === 'mixed' ? pick(['nom', 'fam', 'esq']) : kind;
    return { k, t };
  });
}
/** les dues cares d'una parella */
function memoryFaces(p) {
  const t = p.t;
  if (p.k === 'nom') return [{ type: 'photo', src: photoOf(t, true), alt: t.nom }, { type: 'name', text: t.nom }];
  if (p.k === 'fam') return [{ type: 'name', text: t.nom }, { type: 'fam', fam: t.fam }];
  return [{ type: 'draw', src: t.esquema, alt: 'Esquema' }, { type: 'photo', src: photoOf(t, true), alt: t.nom }];
}
function memoryFront(f) {
  if (f.type === 'photo' || f.type === 'draw') return h('span', { class: 'face front pic' }, pic(f.src, f.alt));
  if (f.type === 'fam') return h('span', { class: 'face front fam', style: '--fc:' + f.fam.color }, famDot(f.fam), h('span', null, f.fam.nom));
  return h('span', { class: 'face front word' }, h('span', null, f.text));
}

function startMemory(cfg, pids) {
  newGame('memory', pids);
  const pairs = buildMemoryPairs(cfg.kind, cfg.size / 2);
  const cards = [];
  pairs.forEach((p, i) => memoryFaces(p).forEach(f => cards.push({ pair: i, face: f, tool: p.t })));
  const deck = shuffle(cards);
  const M = { turn: 0, up: [], busy: false, found: 0, mistakes: 0, combo: 0, pairs: pairs.length, last: null };
  G.cur = pids[0]; G.extra.deck = deck;            // (G.extra.deck: l'auto-prova i les proves automàtiques hi miren)
  const bar = scoreBar(pids, G.scores); G.bar = bar;
  const banner = h('div', { class: 'who-banner slim' });
  const paintTurn = () => {
    const pid = pids[M.turn % pids.length]; G.cur = pid; bar.update(G.scores, pid);
    banner.style.setProperty('--pc', PCOLORS[pid]);
    banner.replaceChildren(avatar(pid, 'md'), h('div', null,
      h('b', null, pids.length > 1 ? 'Torn de ' + pname(pid) : 'Troba les parelles'),
      h('small', null, 'Parelles trobades: ' + M.found + ' de ' + M.pairs + (M.combo > 1 ? ' · combo x' + M.combo : '')),
      M.last ? h('small', { class: 'mem-last' }, '✓ ' + M.last.nom + ' — ' + M.last.fam.nom) : null));
  };
  const cols = cfg.size === 20 ? 5 : 4;
  const grid = h('div', { class: 'mgrid', style: '--cols:' + cols + ';--rows:' + Math.ceil(cfg.size / cols) });
  deck.forEach((c, idx) => {
    c.el = h('button', { class: 'mcard', 'aria-label': 'Targeta ' + (idx + 1), onclick: () => flip(c) },
      h('span', { class: 'face back' }, ico('2753')), memoryFront(c.face));
    grid.append(c.el);
  });
  render(h('div', { class: 'memory' }, bar, banner, grid), 'Memory');
  paintTurn();

  function flip(c) {
    if (M.busy || c.up || c.done) return;
    c.up = true; c.el.classList.add('up'); sfx('flip');
    M.up.push(c);
    if (M.up.length < 2) return;
    M.busy = true;
    const [a, b] = M.up, pid = pids[M.turn % pids.length];
    if (a.pair === b.pair) {
      Timers.set(() => {
        a.done = b.done = true; a.el.classList.add('done'); b.el.classList.add('done');
        a.el.style.setProperty('--pc', PCOLORS[pid]); b.el.style.setProperty('--pc', PCOLORS[pid]);
        M.found++; M.combo++; M.up = []; M.last = a.tool;
        sfx('match'); confettiFrom(a.el, 18);
        addScore(pid, 10 + 2 * (M.combo - 1));
        recordAnswer(pid, a.tool.id, true, false);
        speak(a.tool.nom);
        if (M.found === M.pairs) return Timers.set(endMemory, 900);
        M.busy = false; paintTurn();
      }, 500);
    } else {
      Timers.set(() => {
        a.up = b.up = false; a.el.classList.remove('up'); b.el.classList.remove('up'); M.up = [];
        M.mistakes++; M.combo = 0; recordAnswer(pid, null, false, false);
        M.turn++; M.busy = false; sfx('ko'); paintTurn();
      }, 1200);
    }
  }
  function endMemory() {
    if (M.mistakes === 0 && M.pairs >= 8) pids.forEach(id => award(id, 'memory'));
    const order = pids.slice().sort((x, y) => G.scores[y] - G.scores[x]);
    finishGame({ title: 'Memory acabat!', subtitle: 'Errors en total: ' + M.mistakes, order, scoreText: id => G.scores[id] + ' punts', again: () => startMemory(cfg, pids) });
  }
}

/* ============================================================
   Eines del taller — mode ESCALA D'EINES (12 preguntes, esglaons segurs, 5 comodins)
   (c) 2026 Robert Potau Nuñez. Tots els drets reservats. Mecànica derivada de la «Golden Ladder» d'Adjectivia.
   ============================================================ */
const PRIZES = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 125000];
const STEPS = PRIZES.length;
const SAFE_AT = [3, 7];                       // índexs dels esglaons segurs (el 4t i el 8è)
const fmtPts = n => n.toLocaleString('ca-ES');
const LIFELINES = [
  { id: 'fifty', ic: null, label: 'Meitat', tip: '50:50 — treu dues respostes errònies.' },
  { id: 'audience', ic: '1F465', label: 'La classe', tip: 'La classe vota aixecant la mà.' },
  { id: 'phone', ic: '1F4DE', label: 'Truca a un amic', tip: 'Un company t’ajuda durant 30 segons.' },
  { id: 'swap', ic: '1F500', label: 'Canvi', tip: 'Canvia aquesta pregunta per una altra.' },
  { id: 'double', ic: '1F340', label: 'Doble oportunitat', tip: 'Si falles la primera resposta, en pots triar una altra.' }
];
let L = null;      // estat de l'escala

function setupLadder() {
  setupScreen({
    id: 'ladder', name: 'Escala d’eines', ic: '1F3C6',
    desc: 'Puja ' + STEPS + ' esglaons de preguntes de foto, nom i família que es van complicant. Fes servir bé els comodins!',
    options: [
      { key: 'style', label: 'Com juguem?', def: 'relay', choices: [
        { v: 'relay', label: 'Relleu d’equip', desc: 'Una sola escala per a tothom. Es respon per torns i es comparteixen els comodins.' },
        { v: 'solo', label: 'Un per un', desc: 'Cada jugador puja la seva escala amb els seus comodins.' }] },
      { key: 'timer', label: 'Temps per pregunta', def: 0, choices: [{ v: 0, label: 'Sense límit' }, { v: 60, label: '60 s' }, { v: 30, label: '30 s' }] }
    ],
    rules: ['Els esglaons 4 i 8 són segurs: si caus, et quedes aquests punts.', 'Pots plantar-te en qualsevol moment i quedar-te el que tens.',
      'Fes servir A-D o 1-4 al teclat per respondre; Enter confirma.'],
    onStart: startLadder
  });
}
function startLadder(cfg, pids) {
  newGame('ladder', pids);
  L = { cfg, pids, style: pids.length === 1 ? 'solo' : cfg.style, qi: 0, runIdx: 0, turn: 0, results: [], used: new Set(), life: null, team: 0 };
  G.cur = null;
  beginRun();
}
function curPid() { return L.style === 'solo' ? L.pids[L.runIdx] : L.pids[L.turn % L.pids.length]; }
function freshLife() { return { fifty: true, audience: true, phone: true, swap: true, double: true }; }
function beginRun() {
  L.qi = 0; L.turn = 0; L.life = freshLife(); L.used = new Set(); L.team = 0;
  if (L.style === 'solo') {
    const pid = L.pids[L.runIdx];
    render(h('div', { class: 'intro' }, avatar(pid, 'xxl'), h('h2', null, pname(pid) + ', et toca!'),
      h('p', null, 'Puja l’escala. ' + STEPS + ' preguntes, 5 comodins.'),
      h('button', { class: 'btn primary big', onclick: () => { sfx('start'); askQuestion(); } }, ico('25B6'), ' Comença a pujar')), 'Escala d’eines');
    sfx('start');
  } else askQuestion();
}
/** tipus i dificultat segons l'esglaó: primer foto→nom amb opcions fàcils; al final, esquemes i fotos entre eines de la mateixa família */
function makeLadderQuestion() {
  const qi = L.qi;
  const types = qi < 4 ? ['foto-nom', 'foto-nom', 'nom-fam', 'esq-nom'] : qi < 8 ? ['foto-nom', 'nom-fam', 'foto-fam', 'esq-nom', 'nom-foto'] : ['foto-nom', 'foto-fam', 'esq-nom', 'esq-foto', 'nom-foto', 'def-fam'];
  const close = qi < 2 ? 0 : qi < 8 ? 1 : 2;
  return makeQuestion({ types, close, used: L.used });
}
function safePrize(qi) { return qi > SAFE_AT[1] ? PRIZES[SAFE_AT[1]] : qi > SAFE_AT[0] ? PRIZES[SAFE_AT[0]] : 0; }
function walkPrize(qi) { return qi > 0 ? PRIZES[qi - 1] : 0; }

function askQuestion() {
  const q = makeLadderQuestion();
  const pid = curPid();
  G.cur = pid; L.q = q;                       // (L.q: les proves automàtiques hi miren)
  const S = { q, locked: false, double: false, usedSecond: false, hint: false, pending: -1, qv: null, timer: null };
  let confirmBar;
  const build = () => {
    const fmt = L.style === 'solo' ? fmtPts : null;
    const bar = scoreBar(L.pids, G.scores, fmt);
    G.bar = bar; bar.update(G.scores, pid);
    const who = h('div', { class: 'who-banner', style: '--pc:' + PCOLORS[pid] }, avatar(pid, 'md'),
      h('div', null, h('b', null, pname(pid)), h('small', null, 'Pregunta ' + (L.qi + 1) + ' de ' + STEPS + ' · per ' + fmtPts(PRIZES[L.qi]) + ' punts')));
    const main = h('div', { class: 'ladder-main' });
    main.append(who);
    if (L.cfg.timer) {
      S.timer = countdown(L.cfg.timer, () => { if (!S.locked) lockIn(-1); }, { tick: true });
      main.append(S.timer.el);
    }
    S.qv = qView(q, i => onPick(i));
    main.append(S.qv.el);
    confirmBar = h('div', { class: 'confirm-bar', hidden: true });
    const hintBtn = hintButton(() => { S.hint = true; S.qv.showHint(); });
    const walk = h('button', { class: 'btn small', onclick: () => walkAway() }, ico('1F6D1'), ' Quedar-me ' + fmtPts(walkPrize(L.qi)) + ' i plantar-me');
    main.append(confirmBar, h('div', { class: 'under-q' }, hintBtn, walk));
    const life = h('div', { class: 'lifelines' });
    LIFELINES.forEach(ll => {
      const b = h('button', { class: 'life', disabled: !L.life[ll.id], title: ll.tip, 'aria-label': ll.label + '. ' + ll.tip, onclick: () => useLife(ll.id, S, b) },
        ll.ic ? ico(ll.ic) : h('span', { class: 'fifty' }, '50:50'), h('small', null, ll.label));
      life.append(b);
    });
    const ladder = h('ol', { class: 'prizes' });
    for (let i = STEPS - 1; i >= 0; i--) {
      ladder.append(h('li', { class: (i === L.qi ? 'now ' : '') + (i < L.qi ? 'done ' : '') + (SAFE_AT.includes(i) ? 'safe' : '') },
        h('span', { class: 'n' }, i + 1), h('span', { class: 'v' }, fmtPts(PRIZES[i])), SAFE_AT.includes(i) ? ico('1F6E1', 'tiny') : null));
    }
    const wrap = h('div', { class: 'ladder-wrap' }, bar, h('div', { class: 'ladder' }, main, h('aside', { class: 'ladder-side' }, life, ladder)));
    Keys.on(confirmKeys);
    return wrap;
  };
  render(build, 'Escala d’eines');
  announce('Pregunta ' + (L.qi + 1));

  function onPick(i) {
    if (S.locked) return;
    sfx('click');
    if (!ST.settings.confirm) return lockIn(i);
    S.pending = i; S.qv.select(i);
    confirmBar.hidden = false;
    confirmBar.replaceChildren(h('b', null, 'Resposta definitiva: ' + LETTERS[i] + (q.options[i].label ? ' — ' + q.options[i].label : '') + '?'),
      h('button', { class: 'btn primary', onclick: () => lockIn(S.pending) }, 'Sí, definitiva'),
      h('button', { class: 'btn', onclick: () => { S.pending = -1; S.qv.select(-1); confirmBar.hidden = true; } }, 'No'));
  }
  function confirmKeys(e) {
    if (S.locked || S.pending < 0) return false;
    if (e.key === 'Enter' || e.key.toLowerCase() === 's') { lockIn(S.pending); return true; }
    if (e.key.toLowerCase() === 'n') { S.pending = -1; S.qv.select(-1); confirmBar.hidden = true; return true; }
    return false;
  }
  function lockIn(i) {
    if (S.locked) return;
    S.locked = true; confirmBar.hidden = true;
    if (S.timer) S.timer.stop();
    S.qv.disable(true); S.qv.select(i);
    sfx('tick');
    Timers.set(() => verdict(i), i < 0 ? 100 : 1100);
  }
  function verdict(i) {
    const ok = i === q.answer;
    if (!ok && S.double && !S.usedSecond && i >= 0) {               // doble oportunitat: un altre intent
      S.usedSecond = true; S.locked = false; S.pending = -1; sfx('ko');
      S.qv.markWrong(i); S.qv.select(-1);
      S.qv.btns.forEach(b => { if (!b.classList.contains('wrong') && !b.classList.contains('gone')) b.disabled = false; });
      toast('Doble oportunitat! Torna-ho a provar.', 'gold');
      return;
    }
    S.qv.reveal(i);
    S.qv.showExplain(ok);
    afterAnswerSpeak(q);
    recordAnswer(pid, q.tool.id, ok, S.hint);
    if (ok) {
      sfx('ok'); confettiFrom(S.qv.btns[q.answer], 30);
      if (L.style === 'solo') addScore(pid, PRIZES[L.qi] - G.scores[pid]);
      else { addScore(pid, Math.round(100 * (L.qi + 1) * (S.hint ? 0.5 : 1))); L.team = PRIZES[L.qi]; }
      const victims = L.style === 'solo' ? [pid] : L.pids;
      if (L.qi === SAFE_AT[0]) victims.forEach(v => { award(v, 'escala4'); giveXP(v, 20); });
      if (L.qi === SAFE_AT[1]) victims.forEach(v => { award(v, 'escala8'); giveXP(v, 40); });
      if (L.qi === STEPS - 1) victims.forEach(v => { award(v, 'escala12'); giveXP(v, 100); });
      if (SAFE_AT.includes(L.qi)) { sfx('levelup'); confetti(70); toast('Esglaó segur aconseguit: ' + fmtPts(PRIZES[L.qi]) + ' punts!', 'gold'); }
      Timers.set(() => {
        if (L.qi === STEPS - 1) return endRun('win');
        L.qi++; L.turn++; askQuestion();
      }, 2400);
    } else {
      sfx('ko'); document.body.classList.add('shake'); Timers.set(() => document.body.classList.remove('shake'), 500);
      Timers.set(() => endRun(i < 0 ? 'time' : 'wrong'), 3400);
    }
  }
  function walkAway() {
    if (S.locked) return;
    openModal(h('div', null, h('h3', null, 'Vols quedar-te els punts i plantar-te?'), h('p', null, 'Et quedaràs ' + fmtPts(walkPrize(L.qi)) + ' punts.'),
      h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: closeModal }, 'Segueixo jugant'),
        h('button', { class: 'btn primary', onclick: () => { closeModal(); S.locked = true; if (S.timer) S.timer.stop(); endRun('walk'); } }, 'Me’ls quedo'))));
  }
}

/* ---------- comodins ---------- */
function useLife(id, S, btn) {
  if (S.locked || !L.life[id]) return;
  const q = S.q;
  sfx('lifeline');
  if (id === 'fifty') {
    L.life.fifty = false; btn.disabled = true;
    const wrongs = [0, 1, 2, 3].filter(i => i !== q.answer && !S.qv.btns[i].classList.contains('gone'));
    sample(wrongs, 2).forEach(i => S.qv.eliminate(i));
    if (S.pending >= 0 && S.qv.btns[S.pending].classList.contains('gone')) S.pending = -1;
  } else if (id === 'double') {
    L.life.double = false; btn.disabled = true; S.double = true;
    $('.who-banner').append(h('span', { class: 'badge' }, ico('1F340'), ' Doble oportunitat activa'));
    toast('Doble oportunitat: pots respondre dues vegades.', 'gold');
  } else if (id === 'swap') {
    L.life.swap = false; btn.disabled = true;
    S.locked = true; if (S.timer) S.timer.stop();
    toast('Pregunta nova!', 'gold'); Timers.set(() => askQuestion(), 400);
  } else if (id === 'audience') {
    L.life.audience = false; btn.disabled = true;
    if (S.timer) S.timer.pause();
    audienceModal(q, () => { if (S.timer) S.timer.resume(); });
  } else if (id === 'phone') {
    L.life.phone = false; btn.disabled = true;
    if (S.timer) S.timer.pause();
    phoneModal(q, () => { if (S.timer) S.timer.resume(); });
  }
}
function audienceModal(q, onDone) {
  const votes = [0, 0, 0, 0];
  const rows = h('div', { class: 'vote-rows' });
  const els = [0, 1, 2, 3].map(i => {
    const n = h('b', { class: 'vote-n' }, '0'), bar = h('i');
    rows.append(h('div', { class: 'vote-row c' + i }, h('span', { class: 'letter' }, LETTERS[i]), h('span', { class: 'vl' }, q.options[i].img ? pic(q.options[i].img, '', 'sum-img') : q.options[i].label),
      h('div', { class: 'vbar' }, bar), n,
      h('button', { class: 'btn round small', onclick: () => { votes[i] = Math.max(0, votes[i] - 1); paint(); }, 'aria-label': 'Treu un vot' }, '−'),
      h('button', { class: 'btn round small', onclick: () => { votes[i]++; sfx('click'); paint(); }, 'aria-label': 'Afegeix un vot' }, '+')));
    return { n, bar };
  });
  const paint = () => {
    const tot = votes.reduce((a, b) => a + b, 0);
    els.forEach((e, i) => { e.n.textContent = tot ? Math.round(100 * votes[i] / tot) + '%' : '0'; e.bar.style.width = tot ? (100 * votes[i] / tot) + '%' : '0%'; });
  };
  const cd = countdown(30, () => { sfx('ko'); }, { big: true, tick: true });

/* ---------- final d'una pujada ---------- */
function endRun(kind) {
  const pid = curPid();
  const reached = kind === 'win' ? STEPS : L.qi;               // esglaons respostos bé
  const prize = kind === 'win' ? PRIZES[STEPS - 1] : kind === 'walk' ? walkPrize(L.qi) : safePrize(L.qi);
  if (L.style === 'solo') {
    G.scores[pid] = prize;
    L.results.push({ pid, prize, reached });
    const msg = { win: 'Has pujat tots els esglaons!', walk: 'Has decidit plantar-te.', wrong: 'Oh, aquesta no era la resposta correcta.', time: 'S’ha acabat el temps!' }[kind];
    const last = L.runIdx >= L.pids.length - 1;
    render(h('div', { class: 'intro result' }, avatar(pid, 'xxl'), h('h2', null, msg),
      h('div', { class: 'prize-big' }, ico('1FA99'), fmtPts(prize), h('small', null, ' punts')),
      h('p', null, 'Esglaons respostos bé: ' + reached + ' de ' + STEPS),
      h('button', { class: 'btn primary big', onclick: () => { if (last) finishLadder(); else { L.runIdx++; beginRun(); } } },
        last ? 'Veure el podi' : 'Següent: ' + pname(L.pids[L.runIdx + 1]) + ' →')), 'Escala d’eines');
    if (kind === 'win') { sfx('win'); confetti(200); } else if (kind === 'wrong' || kind === 'time') sfx('lose'); else sfx('ok');
  } else {
    L.teamPrize = prize; L.teamReached = reached; L.teamKind = kind;
    finishLadder();
  }
}
function finishLadder() {
  if (L.style === 'solo') {
    const order = L.pids.slice().sort((a, b) => G.scores[b] - G.scores[a] || (L.results.find(r => r.pid === b).reached - L.results.find(r => r.pid === a).reached));
    finishGame({ title: 'Resultats de l’Escala', order, scoreText: id => fmtPts(G.scores[id]) + ' punts', again: () => startLadder(L.cfg, L.pids) });
  } else {
    const order = L.pids.slice().sort((a, b) => G.scores[b] - G.scores[a]);
    const kind = L.teamKind;
    const note = h('div', { class: 'team-prize' }, ico('1F3C6'), h('div', null, h('b', null, 'Premi de l’equip: ' + fmtPts(L.teamPrize) + ' punts'),
      h('small', null, kind === 'win' ? 'L’equip ha pujat tots els esglaons!' : 'Esglaons respostos bé: ' + L.teamReached + ' de ' + STEPS)));
    finishGame({ title: kind === 'win' ? 'Ho heu aconseguit!' : 'Resultats de l’Escala', subtitle: 'Els punts mostren què ha aportat cada jugador.', order, note,
      scoreText: id => fmtPts(G.scores[id]) + ' punts', again: () => startLadder(L.cfg, L.pids) });
  }
}

/** `per` preguntes per jugador, per torns; cada pregunta mostra l'explicació abans de passar a la següent */
function startRounds(spec) {
  const { cfg, pids } = spec;
  newGame(spec.mode, pids);
  const again = () => startRounds(Object.assign({}, spec));
  const total = cfg.per * pids.length;
  const ctx = { types: spec.types, used: new Set(), close: cfg.level || 0 };
  const bar = scoreBar(pids, G.scores); G.bar = bar;
  let i = 0;
  const perfect = Object.fromEntries(pids.map(id => [id, true]));

  function ask() {
    if (i >= total) return end();
    const q = makeQuestion(ctx);
    const pid = pids[i % pids.length]; G.cur = pid;
    let done = false, moved = false, hint = false, timer = null, qv = null;
    const nextBtn = h('button', { class: 'btn primary', hidden: true, onclick: go }, 'Següent →');
    const hintBtn = hintButton(() => { hint = true; qv.showHint(); });
    render(() => {
      const banner = h('div', { class: 'who-banner slim', style: '--pc:' + PCOLORS[pid] }, avatar(pid, 'md'),
        h('div', null, h('b', null, pname(pid)), h('small', null, 'Pregunta ' + (i + 1) + ' de ' + total)));
      qv = qView(q, pick1);
      const parts = [bar, banner];
      if (cfg.timer) { timer = countdown(cfg.timer, () => pick1(-1), { tick: true }); parts.push(timer.el); }
      parts.push(qv.el, h('div', { class: 'under-q' }, hintBtn, nextBtn));
      Keys.on(e => { if (done && (e.key === 'Enter' || e.key === ' ')) { go(); return true; } return false; });
      return h('div', { class: 'rounds' }, parts);
    }, spec.title);
    bar.update(G.scores, pid);

    function pick1(idx) {
      if (done) return;
      done = true; sfx('click');
      const frac = timer ? Math.max(0, timer.left() / cfg.timer) : null;
      if (timer) timer.stop();
      qv.reveal(idx);
      const ok = idx === q.answer;
      recordAnswer(pid, q.tool.id, ok, hint);
      if (ok) {
        let pts = 10 + Math.min(G.streak[pid] - 1, 5) * 2;
        if (frac != null) pts += Math.round(5 * frac);
        if (hint) pts = Math.round(pts / 2);
        addScore(pid, pts); sfx('ok'); confettiFrom(qv.btns[q.answer], 24);
        toast('+' + pts + ' punts', 'good');
      } else { perfect[pid] = false; sfx('ko'); }
      qv.showExplain(ok); afterAnswerSpeak(q);
      nextBtn.hidden = false; hintBtn.disabled = true;
      Timers.set(go, ok ? 3000 : 4500);
    }
    function go() { if (!done || moved) return; moved = true; i++; ask(); }
  }
  function end() {
    if ((spec.mode === 'defs' || spec.mode === 'esquema') && cfg.per >= 5) pids.forEach(id => { if (perfect[id]) award(id, spec.mode); });
    const order = pids.slice().sort((a, b) => G.scores[b] - G.scores[a]);
    finishGame({ title: spec.title + ' acabat!', order, scoreText: id => G.scores[id] + ' punts (' + G.correct[id] + ' ✓)', again });
  }
  ask();
}

const SPEED_WHAT = { fam: ['foto-fam', 'nom-fam'], nom: ['foto-nom', 'esq-nom'], all: ['foto-fam', 'nom-fam', 'foto-nom', 'esq-nom', 'nom-foto'] };

function startSpeed(cfg, pids) {
  newGame('speed', pids);
  const ctx = { types: SPEED_WHAT[cfg.what] || SPEED_WHAT.fam, used: new Set(), close: cfg.level };
  const bar = scoreBar(pids, G.scores); G.bar = bar;
  let turn = 0;
  function intro() {
    const pid = pids[turn]; G.cur = pid;
    render(h('div', { class: 'intro' }, bar, avatar(pid, 'xxl'), h('h2', null, pname(pid) + ', prepara’t!'),
      h('p', null, cfg.secs + ' segons. Ves tan ràpid com puguis!'),
      h('button', { class: 'btn primary big', onclick: () => countIn(pid) }, ico('26A1'), ' Som-hi!')), 'Ronda ràpida');
    bar.update(G.scores, pid);
  }
  function countIn(pid) {
    let n = 3;
    const big = h('div', { class: 'count-in' }, String(n));
    render(h('div', { class: 'intro' }, big), 'Ronda ràpida');
    sfx('tick');
    Timers.every(() => { n--; if (n <= 0) { run(pid); return; } big.textContent = String(n); sfx('tick'); }, 800);
  }
  function run(pid) {
    let over = false, power = true, answered = 0, wrongs = 0, locked = false, cd = null, stat = null, area = null, current = null;
    const startCorrect = G.correct[pid];
    const paintStat = () => { stat.replaceChildren(h('span', null, ico('2705', 'tiny'), ' ' + (G.correct[pid] - startCorrect) + ' encerts'), h('span', null, ico('1F525', 'tiny'), ' combo x' + G.streak[pid])); };
    render(() => {
      stat = h('div', { class: 'speed-stat' });
      area = h('div', { class: 'speed-area' });
      cd = countdown(cfg.secs, () => { over = true; locked = true; if (current) current.disable(true); sfx('lose'); toast('S’ha acabat el temps!', 'gold'); Timers.set(finishTurn, 1400); }, { big: true, tick: true });
      const pwr = h('button', { class: 'btn small', onclick: () => { if (!power || over) return; power = false; pwr.disabled = true; cd.add(10); sfx('lifeline'); toast('+10 segons!', 'gold'); } }, ico('23F3'), ' +10 s');
      return h('div', { class: 'rounds speed' }, bar, h('div', { class: 'who-banner slim', style: '--pc:' + PCOLORS[pid] }, avatar(pid, 'md'), h('div', null, h('b', null, pname(pid)), h('small', null, 'Ronda ràpida'))),
        cd.el, stat, area, h('div', { class: 'under-q' }, pwr));
    }, 'Ronda ràpida');
    bar.update(G.scores, pid);
    function nextQ() {
      if (over) return;
      const q = makeQuestion(ctx); G.extra.q = q;     // (G.extra.q: les proves automàtiques hi miren)
      locked = false;
      const qv = qView(q, idx => {
        if (locked || over) return;
        locked = true; answered++;
        qv.reveal(idx);
        const ok = idx === q.answer;
        recordAnswer(pid, q.tool.id, ok, false);
        if (ok) { addScore(pid, 10 + Math.min(G.streak[pid] - 1, 5) * 2); sfx('ok'); }
        else { wrongs++; cd.add(-3); sfx('ko'); }
        paintStat();
        Timers.set(() => { qv.destroy(); nextQ(); }, ok ? 450 : 1100);
      });
      current = qv;
      area.replaceChildren(qv.el);
    }
    function finishTurn() {
      const got = G.correct[pid] - startCorrect;
      G.extra[pid] = Math.max(G.extra[pid] || 0, got);
      if (got >= 15) award(pid, 'speed15');
      const last = turn >= pids.length - 1;
      render(h('div', { class: 'intro result' }, bar, avatar(pid, 'xxl'), h('h2', null, pname(pid) + ': ' + got + ' encerts!'),
        h('p', null, answered + ' respostes · ' + wrongs + ' errors'),
        h('button', { class: 'btn primary big', onclick: () => { if (last) endSpeed(); else { turn++; intro(); } } }, last ? 'Veure el podi' : 'Següent: ' + pname(pids[turn + 1]) + ' →')), 'Ronda ràpida');
      bar.update(G.scores, pid);
      sfx(got >= 8 ? 'win' : 'ok'); if (got >= 8) confetti(100);
    }
    paintStat(); nextQ();
  }
  function endSpeed() {
    const order = pids.slice().sort((a, b) => G.scores[b] - G.scores[a]);
    finishGame({ title: 'Ronda ràpida acabada!', order, scoreText: id => G.scores[id] + ' punts (' + (G.extra[id] || 0) + ' ✓)', again: () => startSpeed(cfg, pids) });
  }
  intro();
}
