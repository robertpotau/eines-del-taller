function startMatch(cfg, pids) {
  newGame('match', pids);
  let round = 0, turn = 0, combo = 0, mistakes = 0;
  const bar = scoreBar(pids, G.scores); G.bar = bar;
  function nextRound() {
    if (round >= cfg.rounds) return end();
    const kind = cfg.kind === 'mixed' ? (round % 2 === 0 ? 'nom' : 'fam') : cfg.kind;
    const tools = shuffle(FAMS).slice(0, 5).map(f => pick(toolsOf(f.id)));     // cada una d'una família diferent
    const left = shuffle(tools.map(t => ({ t, side: 'L' })));
    const right = shuffle(tools.map(t => ({ t, side: 'R' })));
    let sel = null, found = 0, busy = false;
    const banner = h('div', { class: 'who-banner slim' });
    const paint = () => {
      const pid = pids[turn % pids.length]; G.cur = pid; bar.update(G.scores, pid);
      banner.style.setProperty('--pc', PCOLORS[pid]);
      banner.replaceChildren(avatar(pid, 'md'), h('div', null, h('b', null, pids.length > 1 ? 'Torn de ' + pname(pid) : 'Uneix les parelles'),
        h('small', null, 'Ronda ' + (round + 1) + ' de ' + cfg.rounds + ' · ' + (kind === 'nom' ? 'foto ↔ nom' : 'nom ↔ família') + ' · parelles: ' + found + ' de 5' + (combo > 1 ? ' · combo x' + combo : ''))));
    };
    const mk = (it, i) => {
      const t = it.t;
      let inner;
      if (it.side === 'L') inner = kind === 'nom' ? pic(photoOf(t, true), t.nom, 'mt-img') : h('span', { class: 'mt-txt' }, t.nom);
      else inner = kind === 'nom' ? h('span', { class: 'mt-txt' }, t.nom) : h('span', { class: 'mt-txt' }, famDot(t.fam), ' ', t.fam.nom);
      const b = h('button', { class: 'mt ' + (it.side === 'L' ? 'mt-l' : 'mt-r'), onclick: () => click(it, b) }, inner);
      it.el = b; return b;
    };
    const colL = h('div', { class: 'mt-col' }, left.map(mk)), colR = h('div', { class: 'mt-col' }, right.map(mk));
    render(h('div', { class: 'matchgame' }, bar, banner, h('div', { class: 'mt-grid' }, colL, colR)), 'Uneix');
    paint();
    function click(it, el) {
      if (busy || it.done) return;
      const pid = pids[turn % pids.length];
      if (it.side === 'L') {
        left.forEach(x => x.el.classList.remove('sel')); sel = it; el.classList.add('sel'); sfx('click');
        if (kind === 'fam') speak(it.t.nom); return;
      }
      if (!sel) { toast('Primer toca un element de l’esquerra', 'gold'); return; }
      const ok = sel.t.id === it.t.id; busy = true;
      if (ok) {
        sel.done = it.done = true; [sel.el, it.el].forEach(e => { e.classList.remove('sel'); e.classList.add('done'); e.style.setProperty('--pc', PCOLORS[pid]); });
        found++; combo++; sfx('match'); confettiFrom(el, 14); addScore(pid, 10 + 2 * (combo - 1)); recordAnswer(pid, it.t.id, true, false);
        sel = null; busy = false; paint();
        if (found === 5) Timers.set(() => { round++; nextRound(); }, 900);
      } else {
        const l = sel; sel = null; mistakes++; combo = 0; recordAnswer(pid, l.t.id, false, false); sfx('ko');
        l.el.classList.add('wrong'); el.classList.add('wrong');
        Timers.set(() => { l.el.classList.remove('wrong', 'sel'); el.classList.remove('wrong'); turn++; busy = false; paint(); }, 900);
      }
    }
  }
  function end() {
    if (!mistakes) pids.forEach(id => award(id, 'match'));
    const order = pids.slice().sort((a, b) => G.scores[b] - G.scores[a]);
    finishGame({ title: 'Uneix acabat!', subtitle: 'Errors en total: ' + mistakes, order, scoreText: id => G.scores[id] + ' punts', again: () => startMatch(cfg, pids) });
  }
  nextRound();
}

/* ---------- Quina eina és? (pistes progressives, per a la pissarra) ---------- */
const HINT_PIX = [9, 18, 38, 0];         // píxels d'amplada a cada pista (0 = foto sencera): com més pistes, més clara és la foto
const HINT_PTS = [10, 7, 4, 2];
function setupHotSeat() {
  setupScreen({
    id: 'hotseat', name: 'Quina eina és?', ic: '1F3A4',
    desc: 'La foto es va veient millor a cada pista. Digues quina eina és el més aviat possible: com menys pistes, més punts!',
    options: [{ key: 'per', label: 'Eines per jugador', def: 3, choices: [{ v: 2, label: '2' }, { v: 3, label: '3' }, { v: 5, label: '5' }] }],
    rules: ['El jugador respon en veu alta; el professor o la classe diu si és correcte.', 'Punts: 10 a la primera pista, 7, 4 i 2 a l’última. A partir de la segona pista també apareix la família.',
      'Es pot jugar sol: llavors ho decideixes tu mateix.'],
    onStart: startHotSeat
  });
}
function startHotSeat(cfg, pids) {
  newGame('hotseat', pids);
  const total = cfg.per * pids.length;
  const used = new Set(), firstTry = Object.fromEntries(pids.map(id => [id, 0]));
  const bar = scoreBar(pids, G.scores); G.bar = bar;
  let i = 0;
  function ask() {
    if (i >= total) return end();
    const pool = TOOLS.filter(t => !used.has(t.id));
    const t = pick(pool.length ? pool : TOOLS); used.add(t.id);
    const pid = pids[i % pids.length]; G.cur = pid;
    const src = photoOf(t, true);
    let lvl = 0, over = false;
    const img = h('canvas', { class: 'hs-img', 'aria-label': 'Foto de l’eina, pixelada' });
    const photo = new Image(); let loaded = false;
    const draw = n => {                       // pixelació: es dibuixa petita i s'amplia sense suavitzar
      if (!loaded) return;
      const iw = photo.naturalWidth, ih = photo.naturalHeight; img.width = iw; img.height = ih;
      const cx = img.getContext('2d'); cx.imageSmoothingEnabled = false;
      if (!n) { cx.drawImage(photo, 0, 0); return; }
      const w = n, hh = Math.max(1, Math.round(n * ih / iw)), tmp = document.createElement('canvas'); tmp.width = w; tmp.height = hh;
      const tc = tmp.getContext('2d'); tc.imageSmoothingEnabled = true; tc.drawImage(photo, 0, 0, w, hh);
      cx.drawImage(tmp, 0, 0, w, hh, 0, 0, iw, ih);
    };
    photo.onload = () => { loaded = true; draw(HINT_PIX[lvl]); };
    photo.src = src;
    const stage = h('div', { class: 'hs-stage' }, img);
    const dots = h('div', { class: 'hs-dots' });
    const info = h('div', { class: 'hs-info' });
    const btns = h('div', { class: 'actions hs-actions' });
    const paint = () => {
      draw(HINT_PIX[lvl]);
      dots.replaceChildren(...HINT_PTS.map((p, k) => h('span', { class: 'hs-dot' + (k === lvl ? ' on' : k < lvl ? ' past' : '') }, p + ' pts')));
      info.replaceChildren(lvl >= 1 ? h('span', null, 'Pista: és una eina de la família ', famChip(t.fam)) : h('span', { class: 'muted' }, 'Pista 1: molt pixelat…'));
      btns.replaceChildren(
        h('button', { class: 'btn primary', onclick: () => finish(true) }, '✓ Correcte (' + HINT_PTS[lvl] + ' punts)'),
        h('button', { class: 'btn', onclick: () => { if (lvl < 3) { lvl++; sfx('flip'); paint(); } else finish(false); } }, lvl < 3 ? '✗ No és — més pista' : '✗ No és'),
        h('button', { class: 'btn small', onclick: () => finish(false) }, 'Passo'));
    };
    function finish(ok) {
      if (over) return; over = true;
      draw(0);
      const pts = ok ? HINT_PTS[lvl] : 0;
      recordAnswer(pid, t.id, ok, lvl > 0);
      if (ok) { addScore(pid, pts); if (lvl === 0) firstTry[pid]++; sfx('ok'); confettiFrom(stage, 40); } else sfx('ko');
      speak(t.nom);
      dots.remove();
      info.replaceChildren(h('div', { class: 'hs-answer' }, h('b', null, t.nom), ' ', famChip(t.fam), ok ? h('span', { class: 'cls-xp' }, ' +' + pts + ' punts') : null));
      btns.replaceChildren(h('button', { class: 'btn primary', id: 'hs-next', onclick: () => { i++; ask(); } }, 'Següent →'));
      const nb = $('#hs-next'); if (nb) nb.focus({ preventScroll: true });
    }
    render(() => {
      const banner = h('div', { class: 'who-banner slim', style: '--pc:' + PCOLORS[pid] }, avatar(pid, 'md'),
        h('div', null, h('b', null, pname(pid)), h('small', null, 'Eina ' + (i + 1) + ' de ' + total)));
      Keys.on(e => { const nb = $('#hs-next'); if (nb && (e.key === 'Enter' || e.key === ' ')) { nb.click(); return true; } return false; });
      return h('div', { class: 'hotseat' }, bar, banner, h('div', { class: 'q-lead' }, 'Quina eina és?'), stage, dots, info, btns);
    }, 'Quina eina és?');
    bar.update(G.scores, pid);
    paint();
  }
  function end() {
    if (pids.some(id => firstTry[id] >= 3)) pids.filter(id => firstTry[id] >= 3).forEach(id => award(id, 'hotseat'));
    const order = pids.slice().sort((a, b) => G.scores[b] - G.scores[a]);
    finishGame({ title: 'Quina eina és? acabat!', order, scoreText: id => G.scores[id] + ' punts', again: () => startHotSeat(cfg, pids) });
  }
  ask();
}

function showHub() {
  if (G) G.live = false;
  const wrap = h('div', { class: 'hub' });
  wrap.append(h('button', { class: 'profile-chip', onclick: () => showProfiles(), title: 'Canvia de perfil' }, ico('1F465'), ' Perfil: ', h('b', null, profileLabel(ST.profiles[ST.cur], ST.cur)), h('small', null, ' · canvia')));
  const strip = h('div', { class: 'pstrip' });
  activePlayers().forEach(p => {
    const ri = rankInfo(p.id);
    strip.append(h('div', { class: 'pmini', style: '--pc:' + PCOLORS[p.id] }, avatar(p.id, 'md'),
      h('div', null, h('b', null, pname(p.id)), h('small', null, ico(ri.rank.ic, 'tiny'), ' ' + ri.rank.name + ' · ' + p.xp + ' XP'), h('div', { class: 'xpbar slim' }, h('i', { style: 'width:' + ri.pct + '%' })))));
  });
  wrap.append(strip);
  GROUPS.forEach(g => {
    const modes = MODES.filter(m => m.group === g.id);
    wrap.append(h('h2', { class: 'hub-title grp', style: '--mc:' + g.color }, ico(g.ic), ' ' + g.name));
    const grid = h('div', { class: 'mode-grid' });
    modes.forEach(m => {
      const soon = !m.go;
      grid.append(h('button', { class: 'mode-card' + (soon ? ' soon' : ''), style: '--mc:' + g.color, disabled: soon, onclick: () => { sfx('click'); m.go(); } },
        ico(m.ic, 'xl'), h('b', null, m.name), h('span', { class: 'md' }, m.desc), h('small', { class: 'tag' }, m.tag)));
    });
    wrap.append(grid);
  });
  wrap.append(h('div', { class: 'hub-actions' },
    h('button', { class: 'btn', onclick: () => showPlayers() }, ico('1F465'), ' Jugadors'),
    h('button', { class: 'btn', onclick: () => showTrophies() }, ico('1F3C6'), ' Trofeus i estadístiques'),
    h('button', { class: 'btn', onclick: showSettings }, ico('2699'), ' Configuració')));
  render(wrap, '');
}
function showSplash() {
  const first = LS.get('profiles', null) === null;
  const wrap = h('div', { class: 'splash' },
    h('div', { class: 'owl' }, ico('1F9F0', 'huge')),
    h('h1', null, 'Eines del taller'),
    h('p', { class: 'tagline' }, 'Reconeix l’eina, el seu nom i la seva família!'),
    h('div', { class: 'splash-faces' }, ['1F528', '1FA9A', '1FA9B', '1F527', '1F4CF', '1F97D', '1F9F0'].map(c => ico(c))),
    h('button', { class: 'btn primary huge', id: 'btn-play', onclick: () => { sfx('start'); if (first) { saveAll(); showProfiles(); } else showHub(); } }, ico('25B6'), ' Juga'),
    h('p', { class: 'muted' }, 'Tecnologia · 39 eines i 10 famílies · 1 a 6 jugadors'));

function boot() {
  fxInit();
  $('#logo-ico').append(ico('1F9F0'));
  $('#btn-settings').append(ico('2699'));
  paintSound();
  $('#ver').textContent = 'v' + VERSION + ' — ' + BUILD_DATE;
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* ignore */ } }
  $('#btn-home').addEventListener('click', () => {
    if (G && G.live) {
      openModal(h('div', null, h('h3', null, 'Vols sortir d’aquest joc?'), h('p', null, 'Es perdrà la partida en curs.'),
        h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: closeModal }, 'Continua jugant'), h('button', { class: 'btn primary', onclick: () => { closeModal(); showHub(); } }, 'Surt'))));
    } else showHub();
  });
  $('#btn-sound').addEventListener('click', () => { ST.settings.sound = !ST.settings.sound; save(); paintSound(); sfx('click'); });
  $('#btn-settings').addEventListener('click', showSettings);
  $('#btn-full').addEventListener('click', () => {
    try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { /* ignore */ }
  });
  if (/#hub\b/.test(location.hash)) showHub(); else showSplash();     // index.html#hub salta la portada
  if (/[?&]selftest/.test(location.search)) runSelfTest();
}

/* ============================================================
   Auto-prova: obre index.html?selftest
   ============================================================ */
function runSelfTest() {
  const out = [], fails = [];
  const log = s => out.push(s);
  const ok = (cond, s) => { if (!cond) { fails.push(s); out.push('FAIL  ' + s); } };

  log('Joc v' + VERSION + ' · eines: ' + TOOLS.length + ' · famílies: ' + FAMS.length);
  ok(TOOLS.length === 39, 'han de ser 39 eines');
  ok(FAMS.length === 10, 'han de ser 10 famílies');
  const ids = new Set(), names = new Set();
  TOOLS.forEach(t => {
    ok(!ids.has(t.id), 'id duplicat ' + t.id); ids.add(t.id);
    ok(!names.has(t.nom), 'nom duplicat ' + t.nom); names.add(t.nom);
    ok(t.fam, 'família desconeguda a ' + t.nom);
    ok(t.fotos.length >= 1, 'sense fotos: ' + t.nom);
    ok(t.esquema, 'sense esquema: ' + t.nom);
    for (let i = 0; i < 30; i++) { const p = photoOf(t, true); ok(p === t.esquema || t.fotos.some(f => f.f === p && f.neta), 'photoOf(clean) dolent a ' + t.nom); }
  });
  FAMS.forEach(f => { ok(toolsOf(f.id).length > 0, 'família buida ' + f.nom); ok(ICONS[f.ic], 'falta la icona de ' + f.nom); log('  ' + f.curt + ': ' + toolsOf(f.id).length + ' eines'); });
  [].concat(AVATARS, RANKS.map(r => r.ic), TROPHIES.map(t => t.ic), MODES.map(m => m.ic), GROUPS.map(g => g.ic)).forEach(c => ok(ICONS[c], 'falta la icona ' + c));

  /* preguntes: tots els tipus, dificultats i eines */
  Q_TYPES.forEach(type => [0, 1, 2].forEach(close => TOOLS.forEach(t => {
    const q = makeQuestion({ types: [type], close, used: new Set(), tool: t });
    const keys = q.options.map(o => o.label || o.img);
    ok(q.options.length === 4 && new Set(keys).size === 4 && q.answer >= 0 && q.answer < 4, 'pregunta dolenta ' + type + ' ' + t.nom);
    const a = q.options[q.answer];
    if (type.endsWith('-nom')) ok(a.label === t.nom, type + ': resposta incorrecta ' + t.nom);
    if (type.endsWith('-fam')) ok(a.label === t.fam.nom, type + ': família incorrecta ' + t.nom);
    if (type.endsWith('-foto')) ok(a.alt === t.nom, type + ': foto incorrecta ' + t.nom);
  })));
  log('Preguntes comprovades: ' + Q_TYPES.length * 3 * TOOLS.length);
  /* fotos: totes han de carregar (comprovació asíncrona) */
  const paths = new Set(); TOOLS.forEach(t => { t.fotos.forEach(f => paths.add(f.f)); paths.add(t.esquema); });
  let loaded = 0, bad = [];
  const box = h('div', { class: 'selftest' }, h('h2', null, 'Auto-prova…'), h('pre', null, ''));
  const finish = () => {
    log('Imatges carregades: ' + loaded + '/' + paths.size + (bad.length ? ' — NO CARREGUEN: ' + bad.join(', ') : ''));
    bad.forEach(b => fails.push('imatge que no carrega: ' + b));
    /* perfils: exportar / importar */
    const payload = exportPayload([0, 1, 2, 3, 4, 5]);
    const back = parseProfilesFile(JSON.stringify(payload));
    ok(JSON.stringify(back.profiles) === JSON.stringify(ST.profiles.map((p, i) => normaliseProfile(p, i))), 'perfils: export/import canvia les dades');
    ['nope', '{}', '{"app":"altra","profiles":[{}]}', '{"app":"eines-del-taller","profiles":[]}'].forEach(bad2 => { let thrown = false; try { parseProfilesFile(bad2); } catch (e) { thrown = true; } ok(thrown, 'perfils: fitxer dolent acceptat: ' + bad2); });
    const evil = parseProfilesFile(JSON.stringify({ app: 'eines-del-taller', profiles: [{ name: 12, active: 99, players: [{ name: 'x'.repeat(50), xp: -5, avatar: 'zzz', trophies: 'no', games: 'many' }], tools: { '01': { ok: 'a', ko: 2, box: 99 } } }] })).profiles[0];
    ok(evil.active === 6 && evil.name === '' && evil.players[0].name.length === 14 && evil.players[0].xp === 0 && AVATARS.includes(evil.players[0].avatar) && evil.players[0].games === 0 && evil.tools['01'].ok === 0 && evil.tools['01'].ko === 2 && evil.tools['01'].box === 5 && evil.players.length === 6, 'perfils: la importació no neteja valors dolents');
    log('Perfils comprovats.');
    window.__selftest = { fails, out, done: true };
    $('h2', box).textContent = fails.length ? '❌ Auto-prova: ' + fails.length + ' problema(es)' : '✅ Auto-prova superada';
    log(fails.length ? 'FAILED' : 'PASSED');
    $('pre', box).textContent = out.join('\n');
  };
  window.__selftest = { fails, out, done: false };
  render(box, 'Auto-prova');
  let pending = paths.size;
  paths.forEach(p => { const im = new Image(); im.onload = () => { loaded++; if (!--pending) finish(); }; im.onerror = () => { bad.push(p); if (!--pending) finish(); }; im.src = p; });
}

boot();
